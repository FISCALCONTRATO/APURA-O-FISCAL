<!doctype html><html><head><meta charset="utf-8"><title>Apuração Fiscal</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Apuração Fiscal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: trilho lateral de navegação + área de trabalho com cabeçalho de contexto (empresa · competência).
   Tons neutros puxados para o verde-petróleo; cor de destaque = petróleo; cores de série: SPED azul, Livro laranja, XML água. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #eef2f1; --surface-3: #e3e9e7;
  --ink: #13201d; --ink-2: #485955; --ink-3: #76857f; --line: #d6dfdc; --line-2: #c3cfcb;
  --accent: #0e5e5a; --accent-2: #0a4542; --accent-ink: #ffffff; --accent-soft: #dfeeec;
  --s-sped: #2a78d6; --s-livro: #eb6834; --s-xml: #1baf7a; --deb: #eb6834; --cred: #2a78d6;
  --crit: #c22b2b; --crit-bg: #fbe9e8; --alto: #c2560a; --alto-bg: #fcefe3; --medio: #9a7400; --medio-bg: #faf3d9; --baixo: #56635f; --baixo-bg: #edf1ef; --pend: #5a49c9; --pend-bg: #eeebfb; --ok: #18794e; --ok-bg: #e3f4ea;
  --shadow: 0 1px 2px rgba(19, 32, 29, .06), 0 6px 18px rgba(19, 32, 29, .05);
  --f-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', 'Arial Narrow', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #151d1b; --surface-2: #1b2522; --surface-3: #24302d;
  --ink: #e4ecea; --ink-2: #a6b5b1; --ink-3: #7a8a86; --line: #283431; --line-2: #34433f;
  --accent: #4fb2a8; --accent-2: #7fcac2; --accent-ink: #062321; --accent-soft: #163330;
  --s-sped: #3987e5; --s-livro: #d95926; --s-xml: #199e70; --deb: #d95926; --cred: #3987e5;
  --crit: #f07272; --crit-bg: #3a1a1a; --alto: #f29453; --alto-bg: #3a2414; --medio: #e1b948; --medio-bg: #342c12; --baixo: #a6b5b1; --baixo-bg: #1f2a27; --pend: #a198ee; --pend-bg: #25213f; --ok: #5bc78d; --ok-bg: #15301f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151d1b; --surface-2: #1b2522; --surface-3: #24302d;
  --ink: #e4ecea; --ink-2: #a6b5b1; --ink-3: #7a8a86; --line: #283431; --line-2: #34433f;
  --accent: #4fb2a8; --accent-2: #7fcac2; --accent-ink: #062321; --accent-soft: #163330;
  --s-sped: #3987e5; --s-livro: #d95926; --s-xml: #199e70; --deb: #d95926; --cred: #3987e5;
  --crit: #f07272; --crit-bg: #3a1a1a; --alto: #f29453; --alto-bg: #3a2414; --medio: #e1b948; --medio-bg: #342c12; --baixo: #a6b5b1; --baixo-bg: #1f2a27; --pend: #a198ee; --pend-bg: #25213f; --ok: #5bc78d; --ok-bg: #15301f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-cond); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 26px; line-height: 1.15; } h2 { font-size: 19px; } h3 { font-size: 15.5px; } h4 { font-size: 13.5px; }
p { margin: 0; }
small { font-size: 11.5px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.muted { color: var(--ink-3); } .b { font-weight: 600; }
.r { text-align: right; } .c { text-align: center; }
.row { display: flex; } .wrap { flex-wrap: wrap; } .aic { align-items: center; } .jsb { justify-content: space-between; } .grow { flex: 1 1 180px; min-width: 0; } .mla { margin-left: auto; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; }
.col { display: flex; flex-direction: column; } .stack { display: grid; gap: 16px; }
.trunc { display: inline-block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.lbl { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; display: block; }
.lede { color: var(--ink-2); max-width: 70ch; margin-top: 6px; }
.note { color: var(--ink-3); font-size: 12px; margin-top: 10px; }
.note.pad { padding: 10px 16px 14px; margin: 0; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.brand .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 12px; letter-spacing: -.02em; }
.brand b { font-family: var(--f-cond); font-size: 16px; letter-spacing: .04em; display: block; line-height: 1.1; }
.brand small { color: var(--ink-3); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.nav button .ix { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); width: 16px; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.nav button.on .ix { color: var(--accent); }
:root[data-theme="dark"] .nav button.on, :root:not([data-theme="light"]) .nav button.on { color: var(--accent-2); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.side .foot { margin-top: auto; font-size: 11.5px; color: var(--ink-3); display: grid; gap: 6px; padding: 0 6px; }
.storage { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); width: fit-content; }
.storage::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.storage.nuvem::before { background: var(--ok); } .storage.local::before { background: var(--medio); } .storage.memoria::before { background: var(--crit); }

.main { min-width: 0; display: flex; flex-direction: column; }
.ctx { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.ctx .sel { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ctx select { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 30px 6px 10px; font-weight: 600; max-width: 380px; min-width: 0; }
.ctx .meta { color: var(--ink-3); font-size: 12px; }
.ctx .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-2); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.content { padding-block: 22px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; max-width: 1360px; width: 100%; }
.vhead { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.vhead > div:first-child { min-width: 0; flex: 1 1 380px; }

/* ---------- componentes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card.pad0 { padding: 0; overflow: hidden; }
.card > h3 + p, .card > .hrow + p { margin-top: 4px; }
.card.empty { display: grid; place-items: center; text-align: center; padding: 40px 18px; } .card.empty h3 { font-size: 18px; } .card.empty p { margin-top: 6px; }
.hrow { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.card.pad0 > .hrow { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.btn { display: inline-flex; gap: 7px; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 12px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg, .nav svg { flex: none; }
.inp, select.inp, textarea.inp { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; }
textarea.inp { width: 100%; min-height: 70px; resize: vertical; }
.w100 { width: 100px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.form label .inp { font-weight: 400; color: var(--ink); }
.form .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; max-width: 480px; }
.check input { margin-top: 3px; }
.segs { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 5px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.seg.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.on.amber { background: var(--medio-bg); color: var(--medio); }
.segs.sm .seg { padding: 3px 8px; font-size: 11.5px; }
.seg:focus-visible { outline: 2px solid var(--accent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 13px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 12px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
.kpi .k { font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.kpi .v { font-family: var(--f-cond); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi .s { font-size: 11.5px; color: var(--ink-3); }
.kpi.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.hl .k, .kpi.hl .s { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--accent); }
.kpi.sev { border-left-width: 4px; }
.kpi.sev-crit { border-left-color: var(--crit); } .kpi.sev-alto { border-left-color: var(--alto); } .kpi.sev-medio { border-left-color: var(--medio); } .kpi.sev-baixo { border-left-color: var(--baixo); } .kpi.sev-pend { border-left-color: var(--pend); } .kpi.sev-ok { border-left-color: var(--ok); }
.src { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.src span { font-family: var(--f-mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.kpi.hl .src span { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--accent-ink) 40%, transparent); }
.src span.sped { border-color: var(--s-sped); } .src span.livro { border-color: var(--s-livro); } .src span.xml { border-color: var(--s-xml); } .src span.calc { border-style: dashed; }

.tblwrap { overflow: auto; max-width: 100%; }
.tblwrap.h320 { max-height: 320px; } .tblwrap.h480 { max-height: 520px; } .tblwrap.h640 { max-height: 660px; }
.tbl .srcrow { flex-wrap: nowrap; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl.dense td { padding: 6px 9px; font-size: 12.5px; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tr.dim td { opacity: .55; }
.tbl tr.tot td { font-weight: 700; background: var(--surface-2); }
.tbl tr.sub td { font-weight: 600; background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.tbl td.dif { color: var(--crit); font-weight: 600; }
.tbl td.difok { color: var(--ok); }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl .grp th { border-bottom: 0; padding-bottom: 0; text-align: center; color: var(--ink-2); }
.tbl .grp th.sped { color: var(--s-sped); } .tbl .grp th.livro { color: var(--s-livro); } .tbl .grp th.xml { color: var(--s-xml); }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.imp { background: var(--pend-bg); color: var(--pend); border-color: transparent; }
.tag.amber { background: var(--medio-bg); color: var(--medio); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sev-crit .pill, .pill.sev-crit { background: var(--crit-bg); color: var(--crit); }
.sev-alto .pill, .pill.sev-alto { background: var(--alto-bg); color: var(--alto); }
.sev-medio .pill, .pill.sev-medio { background: var(--medio-bg); color: var(--medio); }
.sev-baixo .pill, .pill.sev-baixo { background: var(--baixo-bg); color: var(--baixo); }
.sev-pend .pill, .pill.sev-pend { background: var(--pend-bg); color: var(--pend); }
.pill.sev-ok { background: var(--ok-bg); color: var(--ok); }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--medio-bg); color: var(--medio); } .chip.bad { background: var(--crit-bg); color: var(--crit); } .chip.off { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3); }
.sevdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); vertical-align: middle; }
.sevdot.crit { background: var(--crit); } .sevdot.alto { background: var(--alto); } .sevdot.medio { background: var(--medio); } .sevdot.baixo { background: var(--baixo); } .sevdot.pend { background: var(--pend); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r); font-size: 13px; border: 1px solid transparent; }
.banner.warn { background: var(--medio-bg); color: var(--ink); border-color: color-mix(in srgb, var(--medio) 35%, transparent); }
.banner.bad { background: var(--crit-bg); color: var(--ink); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner.ok { background: var(--ok-bg); color: var(--ink); }
.banner svg { flex: none; margin-top: 2px; }

/* matriz de competências */
.compgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.compcard { all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.compcard:hover { border-color: var(--accent); } .compcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.compcard:focus-visible { outline: 2px solid var(--accent); }
.compcard .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.compcard .t b { font-family: var(--f-cond); font-size: 17px; }
.srcrow { display: flex; gap: 5px; flex-wrap: wrap; }
.srcbox { white-space: nowrap; font-family: var(--f-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-3); }
.srcbox.on.sped { border-color: var(--s-sped); color: var(--ink); } .srcbox.on.livro { border-color: var(--s-livro); color: var(--ink); } .srcbox.on.xml { border-color: var(--s-xml); color: var(--ink); }
.srcbox.on::before { content: "● "; } .srcbox.on.sped::before { color: var(--s-sped); } .srcbox.on.livro::before { color: var(--s-livro); } .srcbox.on.xml::before { color: var(--s-xml); }
.meter { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; } .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* importação */
.drops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; background: var(--surface); position: relative; min-width: 0; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.drop h3 { display: flex; gap: 8px; align-items: center; }
.drop .dot { width: 10px; height: 10px; border-radius: 50%; }
.drop ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
.steps { display: grid; gap: 8px; }

// ---------------------------------------------------------------- leitor SPED
function parseSped(text) {
  const lines = text.split('\n');
  const S = {
    meta: null, erros: [], avisos: [], contagem: {}, declarado: {}, qtdLin9999: null, linhas: 0, desconhecidos: {},

    const bl = r[0];

    switch (r) {

      case '0200': itens[f[2]] = { d: f[3], ncm: f[8], cest: f[13] || '', tipo: f[7] }; S.itens0200++; break;
      case 'C100': case 'D100': case 'C500': case 'D500': case 'D700': {

        else d = { reg: r, oper: f[2], emit: f[3], part: f[4], mod: f[5], sit: f[6], ser: f[7], num: f[8], chave: (/^\d{44}$/.test(f[22] || '') ? f[22] : ''), dtDoc: f[9], dtES: f[10], vlDoc: U.n(f[11]), vlDesc: U.n(f[12]), vlMerc: U.n(f[13]), vlFrt: 0, vlSeg: 0, vlOut: 0, bc: U.n(f[17]), icms: U.n(f[18]), bcSt: 0, st: 0, ipi: 0 };
        if (r === 'C500' && !/^\d{44}$/.test(d.chave)) d.chave = '';
        const p = part[d.part] || {};
        Object.assign(d, { src: 'SPED', partNome: (p.nome || '').slice(0, 70), partCnpj: p.cnpj || '', partUf: p.uf || '', fcp: 0, an: [], itens: 0, linha: idx });
        if (d.chave) {
          if (chavesVistas.has(d.chave)) S.avisos.push({ linha: idx, msg: 'Chave de acesso repetida na escrituração (também na linha ' + chavesVistas.get(d.chave) + ')', chave: d.chave, tipo: 'duplicado' });

        }
        doc = d;
        break;
      }
      case 'C170': if (doc) doc.itens++; break;
      case 'C101': S.c101.fcpDest += U.n(f[2]); S.c101.icmsDest += U.n(f[3]); S.c101.icmsRem += U.n(f[4]); S.c101.n++; if (doc) doc.fcp += U.n(f[2]); break;
      case 'C197': case 'D197': { const k = f[2]; const a = S.ajDoc[k] || (S.ajDoc[k] = { cod: k, descr: (f[3] || '').slice(0, 120), vl: 0, n: 0, reg: r }); a.vl += U.n(f[7]); a.n++; break; }
      case 'E110': S.e110 = { totDeb: U.n(f[2]), ajDeb: U.n(f[3]), totAjDeb: U.n(f[4]), estCred: U.n(f[5]), totCred: U.n(f[6]), ajCred: U.n(f[7]), totAjCred: U.n(f[8]), estDeb: U.n(f[9]), sldAnt: U.n(f[10]), sldApurado: U.n(f[11]), totDed: U.n(f[12]), recolher: U.n(f[13]), transportar: U.n(f[14]), debEsp: U.n(f[15]) }; break;
      case 'E111': S.e111.push({ cod: f[2], descr: (f[3] || '').slice(0, 200), vl: U.n(f[4]), linha: idx }); break;
      case 'E113': S.e113++; break;
      case 'E115': S.e115.push({ cod: f[2], vl: U.n(f[3]), descr: f[4] || '' }); break;
      case 'E116': S.e116.push({ codOr: f[2], vl: U.n(f[3]), vcto: f[4], codRec: f[5], proc: f[6], mes: f[10] || '' }); break;
      case 'E200': lastUfE200 = { uf: f[2], ini: f[3], fin: f[4], e210: null }; S.e200.push(lastUfE200); break;
      case 'E210': if (lastUfE200) lastUfE200.e210 = { mov: f[2], sldCredAnt: U.n(f[3]), devol: U.n(f[4]), ressarc: U.n(f[5]), outCred: U.n(f[6]), ajCred: U.n(f[7]), retencao: U.n(f[8]), outDeb: U.n(f[9]), ajDeb: U.n(f[10]), sldDevAnt: U.n(f[11]), ded: U.n(f[12]), recolher: U.n(f[13]), transportar: U.n(f[14]), debEsp: U.n(f[15]) }; break;
      case 'E300': lastUfE300 = { uf: f[2], ini: f[3], fin: f[4], e310: null }; S.e300.push(lastUfE300); break;
      case 'E310': if (lastUfE300) lastUfE300.e310 = { mov: f[2], sldCredAntDifal: U.n(f[3]), totDebDifal: U.n(f[4]), outDebDifal: U.n(f[5]), totCredDifal: U.n(f[6]), outCredDifal: U.n(f[7]), sldDevAntDifal: U.n(f[8]), dedDifal: U.n(f[9]), recolDifal: U.n(f[10]), transpDifal: U.n(f[11]), debEspDifal: U.n(f[12]), sldCredAntFcp: U.n(f[13]), totDebFcp: U.n(f[14]), outDebFcp: U.n(f[15]), totCredFcp: U.n(f[16]), outCredFcp: U.n(f[17]), sldDevAntFcp: U.n(f[18]), dedFcp: U.n(f[19]), recolFcp: U.n(f[20]), transpFcp: U.n(f[21]), debEspFcp: U.n(f[22]) }; break;
      case 'E500': lastE500 = { ind: f[2], ini: f[3], fin: f[4], e510: [], e520: null }; S.e500.push(lastE500); break;
      case 'E510': if (lastE500) lastE500.e510.push({ cfop: f[2], cst: f[3], vc: U.n(f[4]), bc: U.n(f[5]), ipi: U.n(f[6]) }); break;
      case 'E520': if (lastE500) lastE500.e520 = { sdAnt: U.n(f[2]), deb: U.n(f[3]), cred: U.n(f[4]), od: U.n(f[5]), oc: U.n(f[6]), sc: U.n(f[7]), sd: U.n(f[8]) }; break;
      case 'G110': S.g110 = { ini: f[2], fin: f[3], saldoIn: U.n(f[4]), somParc: U.n(f[5]), trib: U.n(f[6]), total: U.n(f[7]), indPer: U.n(f[8]), apropriado: U.n(f[9]), outros: U.n(f[10]) }; break;
      case 'H005': S.h005 = { dt: f[2], vl: U.n(f[3]), mot: f[4] }; break;
      case 'H010': S.h010.n++; S.h010.soma += U.n(f[6]); break;
      case 'K200': S.k200++; break;
      case '1010': S.r1010 = f.slice(2, -1); break;
      case '1900': S.r1900++; break;
      case '9900': S.declarado[f[2]] = parseInt(f[3], 10); break;
      case '9999': S.qtdLin9999 = parseInt(f[2], 10); break;
      default: break;
    }
    if (r.endsWith('990') && r !== '9990' && /^[0-9A-K]990$/.test(r)) blocoAberto[r[0]] = { declarado: parseInt(f[2], 10) };
    if (r === '9990') blocoAberto['9'] = { declarado: parseInt(f[2], 10) };

    const pos = LEIAUTE.analiticos[r];
    if (pos) {
      const g = (i) => (i === null ? 0 : U.n(f[i]));
      const a = { reg: r, cst: f[pos[0]] || '', cfop: f[pos[1]] || '', aliq: g(pos[2]), vo: g(pos[3]), bc: g(pos[4]), icms: g(pos[5]), bcSt: g(pos[6]), st: g(pos[7]), red: g(pos[8]), ipi: g(pos[9]) };
      const k = [r, a.cst, a.cfop, a.aliq].join('|');
      const t = S.analitico[k] || (S.analitico[k] = { reg: r, cst: a.cst, cfop: a.cfop, aliq: a.aliq, vo: 0, bc: 0, icms: 0, bcSt: 0, st: 0, red: 0, ipi: 0, n: 0 });
      t.vo += a.vo; t.bc += a.bc; t.icms += a.icms; t.bcSt += a.bcSt; t.st += a.st; t.red += a.red; t.ipi += a.ipi; t.n++;

  for (const [reg, q] of Object.entries(S.declarado)) {
    const real = S.contagem[reg] || 0;

  }
  for (const reg of Object.keys(S.contagem)) if (S.declarado[reg] === undefined && Object.keys(S.declarado).length) S.erros.push({ msg: 'Registro ' + reg + ' sem totalizador no 9900', reg });
  for (const [bl, info] of Object.entries(blocoAberto)) {
    const real = S.blocos[bl] || 0;
    if (info.declarado !== real) S.erros.push({ msg: 'Encerramento do bloco ' + bl + ' declara ' + info.declarado + ' linhas; o bloco tem ' + real });
  }

    else if (ano && (ano < v[0] || ano > v[1])) S.avisos.push({ msg: 'Leiaute ' + S.meta.codVer + ' vigora para ' + v[0] + (v[1] !== v[0] ? '–' + v[1] : '') + ', mas o período do arquivo é ' + ano, tipo: 'leiaute' });

}

/** Resumo compacto (grava no banco) + documentos (grava em blocos) */
function resumoSped(S) {
  const an = Object.values(S.analitico).map(a => ({ ...a, vo: U.r2(a.vo), bc: U.r2(a.bc), icms: U.r2(a.icms), bcSt: U.r2(a.bcSt), st: U.r2(a.st), red: U.r2(a.red), ipi: U.r2(a.ipi) }));
  const ent = an.filter(a => '123'.includes(a.cfop[0])), sai = an.filter(a => '567'.includes(a.cfop[0]));
  const tot = (arr, k) => U.r2(U.sum(arr, x => x[k]));
  const sitCount = {};
  S.docs.forEach(d => { sitCount[d.sit] = (sitCount[d.sit] || 0) + 1; });
  return {
    meta: S.meta ? Object.assign({}, S.meta, { fantasia: S.fantasia || '' }) : null, linhas: S.linhas, erros: S.erros.slice(0, 80), avisos: S.avisos.slice(0, 120),
    contagem: S.contagem, declarado: S.declarado, blocos: S.blocos,
    analitico: an,
    totais: {
      entVC: tot(ent, 'vo'), entBC: tot(ent, 'bc'), entICMS: tot(ent, 'icms'), entST: tot(ent, 'st'), entIPI: tot(ent, 'ipi'),
      saiVC: tot(sai, 'vo'), saiBC: tot(sai, 'bc'), saiICMS: tot(sai, 'icms'), saiST: tot(sai, 'st'), saiIPI: tot(sai, 'ipi'),
    },
    e110: S.e110, e111: S.e111, e113: S.e113, e115: S.e115, e116: S.e116, e200: S.e200, e300: S.e300, e500: S.e500,
    g110: S.g110, h005: S.h005, h010: { n: S.h010.n, soma: U.r2(S.h010.soma) }, k200: S.k200, r1010: S.r1010, r1900: S.r1900,
    c101: S.c101, ajDoc: Object.values(S.ajDoc),
    docs: { total: S.docs.length, porReg: S.docs.reduce((m, d) => (m[d.reg] = (m[d.reg] || 0) + 1, m), {}), porSit: sitCount, entradas: S.docs.filter(d => d.oper === '0').length, saidas: S.docs.filter(d => d.oper === '1').length, comChave: S.docs.filter(d => d.chave).length },
    participantes: S.participantes, itens0200: S.itens0200,
  };
}

const UTIL_AJ = { '0': 'Outros débitos', '1': 'Estorno de créditos', '2': 'Outros créditos', '3': 'Estorno de débitos', '4': 'Deduções', '5': 'Débitos especiais' };

function reconstruirApuracao(R, livro, anterior) {
  // R = resumo SPED; livro = dados do livro (ou null); anterior = resumo SPED da competência anterior (ou null)
  const e = R.e110 || {};

  const deb = an.filter(a => '567'.includes(a.cfop[0]));
  const cred = an.filter(a => '123'.includes(a.cfop[0]));

  e111.forEach(x => { const u = (x.cod || '')[3] || '?'; porUtil[u] = (porUtil[u] || 0) + x.vl; });
  const recDeb = U.r2(U.sum(deb, x => x.icms));
  const recCred = U.r2(U.sum(cred, x => x.icms));
  const sldAntPrev = anterior && anterior.e110 ? anterior.e110.transportar : null;
  const res = livro && livro.resumo ? livro.resumo : {};
  const L = (k) => (res[k] && res[k].valor !== null && res[k].valor !== undefined) ? res[k].valor : null;

      cfopRows.push({ p: l.p, tp: '123'.includes(cfop[0]) ? 'entrada' : 'saida', cfop, vals });
      abas['123'.includes(cfop[0]) ? 'entrada' : 'saida'].push([cfop, desc, vals[0] ?? null, vals[1] ?? null, vals[2] ?? null, vals[3] ?? null, vals[4] ?? null]);
    } else if (nums.length) {
      const rot = txt.replace(RE_NUM_LIVRO, '').trim();
      const nr = U.norm(rot);
      const t = nr.match(/^([1-7])\s*-\s*(p\/o\s*|p\/\s*)?(estado|out\.?\s*estados?|outros estados|exterior)/) ? nr[0] : (/^totais/.test(nr) ? 'T' : null);
      if (t && nums.length >= 3) totais.push({ p: l.p, grupo: t, rot, vals: nums.map(numLivro) });
      else resumo.push([rot, numLivro(nums[nums.length - 1])]);
    }
  });
  if (!cfopRows.length && porUf.length) {
    const ag = new Map(); porUf.forEach(r => { const x = ag.get(r.cfop) || ag.set(r.cfop, { cfop: r.cfop, vals: [0, 0, 0, 0, 0] }).get(r.cfop); r.vals.forEach((v, i) => { x.vals[i] = U.r2(x.vals[i] + (v || 0)); }); });
    for (const x of ag.values()) { const tp = '123'.includes(x.cfop[0]) ? 'entrada' : 'saida'; cfopRows.push({ p: 0, tp, cfop: x.cfop, vals: x.vals }); abas[tp].push([x.cfop, 'consolidado das páginas por UF', ...x.vals]); }
    avisos.push('O livro só trouxe o resumo por UF; os CFOPs foram consolidados a partir dele (linhas quebradas podem não ter sido lidas) — confira os totais.');
  } else if (temUf) avisos.push('Páginas de resumo por estado/UF reconhecidas e desconsideradas na soma (repetem os CFOPs já lidos).');
  // conferência com os totalizadores impressos (detecta erro de leitura/OCR)
  const conf = [];
  const cols = [[0, 'valor contábil'], [1, 'base'], [2, 'imposto'], [3, 'isentas'], [4, 'outras']];
  const tipoPag = {}; cfopRows.forEach(r => { tipoPag[r.p] = r.tp; });
  totais.forEach(t => {
    const tp = '123'.includes(t.grupo) ? 'entrada' : ('567'.includes(t.grupo) ? 'saida' : tipoPag[t.p]);
    if (!tp) return;
    const alvo = cfopRows.filter(r => r.tp === tp && (t.grupo === 'T' || r.cfop[0] === t.grupo));
    cols.forEach(([i, nome]) => {
      const imp = t.vals[i]; if (imp === undefined || imp === null) return;
      const sm = U.r2(alvo.reduce((a, r) => a + (r.vals[i] || 0), 0));
      if (Math.abs(sm - imp) > 0.05) conf.push((tp === 'entrada' ? 'Entradas' : 'Saídas') + ' · ' + t.rot + ' · ' + nome + ': soma das linhas lidas ' + U.brl(sm) + ' × total impresso ' + U.brl(imp));
    });
  });
  if (conf.length) conf.slice(0, 12).reverse().forEach(c => avisos.unshift('Total não confere — ' + c + '. Revise as linhas desse grupo.'));
  const okTotais = totais.length && !conf.length;
  return { abas: [{ nome: 'Entradas (PDF)', aoa: abas.entrada }, { nome: 'Saídas (PDF)', aoa: abas.saida }, { nome: 'Resumo (PDF)', aoa: resumo }, { nome: 'Cabeçalho (PDF)', aoa: cabecalho }], avisos, linhas: linhas.length, totais: totais.length, totaisConferem: okTotais, ocr: !!opts.ocr };
}

// ---------------------------------------------------------------- XML (NF-e / CT-e / eventos)
function parseXml(text, nome) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return { tipo: 'erro', nome, erro: 'XML malformado' };
  const q = (el, tag) => { if (!el) return null; const x = el.getElementsByTagNameNS('*', tag); return x.length ? x[0] : null; };
  const t = (el, tag) => { const x = q(el, tag); return x ? x.textContent.trim() : ''; };
  const v = (el, tag) => U.n(t(el, tag).replace('.', ','));
  const root = doc.documentElement.localName;
  if (root === 'procEventoNFe' || root === 'evento' || root === 'procEventoCTe') {
    const inf = q(doc, 'infEvento');
    return { tipo: 'evento', nome, chave: t(inf, 'chNFe') || t(inf, 'chCTe'), tpEvento: t(inf, 'tpEvento'), descEvento: t(inf, 'descEvento'), dh: t(inf, 'dhEvento'), cStat: t(q(doc, 'retEvento'), 'cStat') };
  }
  const infNFe = q(doc, 'infNFe');
  if (infNFe) {
    const ide = q(infNFe, 'ide'), emit = q(infNFe, 'emit'), dest = q(infNFe, 'dest'), tot = q(infNFe, 'ICMSTot');
    const chave = (infNFe.getAttribute('Id') || '').replace(/^NFe/, '');
    const prot = q(doc, 'infProt');
    const itens = [];
    const dets = infNFe.getElementsByTagNameNS('*', 'det');
    for (let i = 0; i < dets.length; i++) {
      const d = dets[i], prod = q(d, 'prod'), icms = q(d, 'ICMS');
      let grp = icms ? [...icms.children][0] : null;
      itens.push({ n: d.getAttribute('nItem'), cProd: t(prod, 'cProd'), xProd: t(prod, 'xProd').slice(0, 80), ncm: t(prod, 'NCM'), cest: t(prod, 'CEST'), cfop: t(prod, 'CFOP'), vProd: v(prod, 'vProd'), orig: t(grp, 'orig'), cst: t(grp, 'CST') || t(grp, 'CSOSN'), vBC: v(grp, 'vBC'), pICMS: v(grp, 'pICMS'), vICMS: v(grp, 'vICMS'), vBCST: v(grp, 'vBCST'), vST: v(grp, 'vICMSST'), vFCP: v(grp, 'vFCP'), vIPI: v(q(d, 'IPI'), 'vIPI') });
    }
    const dh = t(ide, 'dhEmi') || t(ide, 'dEmi');
    const ddmmaaaa = dh ? dh.slice(8, 10) + dh.slice(5, 7) + dh.slice(0, 4) : '';
    return {
      tipo: 'nfe', nome, chave, mod: t(ide, 'mod'), serie: t(ide, 'serie'), nNF: t(ide, 'nNF'), dhEmi: ddmmaaaa, tpNF: t(ide, 'tpNF'), natOp: t(ide, 'natOp').slice(0, 60), finNFe: t(ide, 'finNFe'),
      emitCnpj: t(emit, 'CNPJ') || t(emit, 'CPF'), emitNome: t(emit, 'xNome').slice(0, 70), emitUf: t(q(emit, 'enderEmit'), 'UF'), emitIE: t(emit, 'IE'), emitCRT: t(emit, 'CRT'),
      destCnpj: t(dest, 'CNPJ') || t(dest, 'CPF'), destNome: t(dest, 'xNome').slice(0, 70), destUf: t(q(dest, 'enderDest'), 'UF'), destIE: t(dest, 'IE'),
      vNF: v(tot, 'vNF'), vProd: v(tot, 'vProd'), vBC: v(tot, 'vBC'), vICMS: v(tot, 'vICMS'), vBCST: v(tot, 'vBCST'), vST: v(tot, 'vST'), vIPI: v(tot, 'vIPI'), vFrete: v(tot, 'vFrete'), vSeg: v(tot, 'vSeg'), vDesc: v(tot, 'vDesc'), vOutro: v(tot, 'vOutro'), vFCP: v(tot, 'vFCP'), vFCPST: v(tot, 'vFCPST'), vFCPUFDest: v(tot, 'vFCPUFDest'), vICMSUFDest: v(tot, 'vICMSUFDest'),
      cStat: t(prot, 'cStat'), nProt: t(prot, 'nProt'), autorizada: !prot ? null : ['100', '150'].includes(t(prot, 'cStat')), itens,
    };
  }
  const infCte = q(doc, 'infCte');
  if (infCte) {
    const ide = q(infCte, 'ide'), emit = q(infCte, 'emit'), vPrest = q(infCte, 'vPrest'), imp = q(infCte, 'ICMS');
    const grp = imp ? [...imp.children][0] : null;
    const dh = t(ide, 'dhEmi');
    const prot = q(doc, 'infProt');
    return { tipo: 'cte', nome, chave: (infCte.getAttribute('Id') || '').replace(/^CTe/, ''), mod: t(ide, 'mod'), serie: t(ide, 'serie'), nNF: t(ide, 'nCT'), dhEmi: dh ? dh.slice(8, 10) + dh.slice(5, 7) + dh.slice(0, 4) : '', cfopCte: t(ide, 'CFOP'), emitCnpj: t(emit, 'CNPJ'), emitNome: t(emit, 'xNome').slice(0, 70), emitUf: t(q(emit, 'enderEmit'), 'UF'), tomaCnpj: '', vNF: v(vPrest, 'vTPrest'), vProd: v(vPrest, 'vRec'), vBC: v(grp, 'vBC'), vICMS: v(grp, 'vICMS'), cst: t(grp, 'CST'), cStat: t(prot, 'cStat'), autorizada: !prot ? null : ['100', '150'].includes(t(prot, 'cStat')), itens: [] };
  }
  return { tipo: 'desconhecido', nome, raiz: root };
}

/** XML -> documento normalizado do ponto de vista da empresa */
function xmlParaDoc(x, cnpjEmpresa) {
  const raiz = (cnpjEmpresa || '').slice(0, 14);
  const propria = x.emitCnpj === raiz;
  let oper;
  if (x.tipo === 'cte') oper = propria ? '1' : '0';
  else oper = propria ? (x.tpNF === '0' ? '0' : '1') : '0';
  const pertence = propria || x.destCnpj === raiz || x.tipo === 'cte';
  const cfops = [...new Set((x.itens || []).map(i => i.cfop).filter(Boolean))];

  const csts = [...new Set((x.itens || []).map(i => (i.orig || '') + (i.cst || '')).filter(Boolean))];
  return {
    src: 'XML', reg: x.tipo === 'cte' ? 'CTe' : 'NFe', oper, emit: propria ? '0' : '1', mod: x.mod, sit: x.cancelada ? '02' : (x.autorizada === false ? 'XX' : '00'), ser: String(parseInt(x.serie || '0', 10)), num: String(parseInt(x.nNF || '0', 10)), chave: x.chave, dtDoc: x.dhEmi,
    partCnpj: propria ? x.destCnpj : x.emitCnpj, partNome: propria ? x.destNome : x.emitNome, partUf: propria ? x.destUf : x.emitUf,

    cfops, csts, aliqs: [...new Set((x.itens || []).filter(i => i.pICMS).map(i => i.pICMS))], ncms: [...new Set((x.itens || []).map(i => i.ncm).filter(Boolean))],
    itensXml: (x.itens || []).map(i => [i.cProd, i.ncm, i.cest, i.cfop, (i.orig || '') + (i.cst || ''), i.pICMS, U.r2(i.vProd), U.r2(i.vBC), U.r2(i.vICMS)]),
    natOp: x.natOp, emitCRT: x.emitCRT, pertence, propria, cStat: x.cStat, cancelada: !!x.cancelada, arquivo: x.nome,
  };
}

// ---------------------------------------------------------------- motor de conciliação
const RISCOS = ['Crítico', 'Alto', 'Médio', 'Baixo', 'Pendente de documentação'];
const CLASSES = { integridade: 'Integridade documental', valor: 'Divergência de valor', classificacao: 'Classificação fiscal', competencia: 'Competência', apuracao: 'Apuração / Bloco E', estrutura: 'Estrutura do arquivo', livro: 'Livro × SPED' };

function chaveAlt(d) { return [d.mod || '55', String(parseInt(d.ser || '0', 10) || 0), String(parseInt(d.num || '0', 10)), (d.partCnpj || '').slice(0, 14), d.oper].join('|'); }

function riscoValor(dif, cfg, base) {
  const a = Math.abs(dif);
  if (a >= cfg.matCritica) return base === 'Médio' ? 'Alto' : 'Crítico';
  if (a >= cfg.matAlta) return base === 'Médio' ? 'Médio' : 'Alto';
  return base === 'Médio' ? 'Baixo' : 'Médio';
}

/**
 * Confronta documentos SPED x XML x Livro (nível documento).
 * outras: Map chave -> competência em que aparece em outro SPED da mesma empresa
 */
function conciliar({ comp, cnpj, sped, xml, livro, outras, cfg }) {
  cfg = Object.assign({ tol: 0.05, matCritica: 5000, matAlta: 500 }, cfg || {});
  const grupos = new Map(); // id -> {sped, xml, livro}
  const keyOf = (d) => d.chave && d.chave.length === 44 ? 'K' + d.chave : 'A' + chaveAlt(d);
  const dup = [];
  const put = (lista, fonte) => {
    (lista || []).forEach(d => {
      const k = keyOf(d);
      const g = grupos.get(k) || { k, sped: null, xml: null, livro: null };
      if (g[fonte]) { dup.push({ fonte, d, k }); if (fonte === 'livro') { ['vlDoc', 'bc', 'icms', 'st', 'ipi'].forEach(f => { g.livro[f] = (g.livro[f] || 0) + (d[f] || 0); }); g.livro.cfops = [...new Set([...(g.livro.cfops || []), d.cfop])]; } }
      else { g[fonte] = fonte === 'livro' ? { ...d, cfops: [d.cfop] } : d; }
      grupos.set(k, g);
    });
  };
  put(sped, 'sped'); put(xml, 'xml'); put(livro, 'livro');
  // segunda passada: docs sem chave do livro que casam por número/série/CNPJ com doc que tem chave
  const alt = new Map();
  for (const g of grupos.values()) { const d = g.sped || g.xml; if (d && g.k[0] === 'K') alt.set(chaveAlt(d), g); }
  for (const [k, g] of [...grupos.entries()]) {
    if (k[0] === 'A' && g.livro && !g.sped && !g.xml) { const m = alt.get(chaveAlt(g.livro)) || alt.get(chaveAlt({ ...g.livro, partCnpj: '' })); if (m && !m.livro) { m.livro = g.livro; grupos.delete(k); } }
  }
  const temXml = (xml || []).length > 0, temLivro = (livro || []).length > 0;
  const linhas = [];
  const aps = [];
  const add = (g, classe, regra, risco, msg, extra) => { const ap = Object.assign({ id: U.h(comp + '|' + regra + '|' + g.k), comp, classe, regra, risco, msg, k: g.k, chave: (g.sped || g.xml || g.livro || {}).chave || '', num: (g.sped || g.xml || g.livro || {}).num || '', valor: 0, difTrib: 0 }, extra || {}); aps.push(ap); g.aps.push(ap); };
  const tol = cfg.tol;
  const CMP = [['vlDoc', 'Valor total do documento', 'vlDoc', 'vlDoc'], ['vlMerc', 'Valor dos produtos', 'vlMerc', null], ['bc', 'Base de cálculo do ICMS', 'bc', 'bc'], ['icms', 'Valor do ICMS', 'icms', 'icms'], ['bcSt', 'Base do ICMS-ST', 'bcSt', null], ['st', 'Valor do ICMS-ST', 'st', 'st'], ['ipi', 'Valor do IPI', 'ipi', 'ipi'], ['vlFrt', 'Frete', 'vlFrt', null], ['vlDesc', 'Descontos', 'vlDesc', null], ['vlOut', 'Outras despesas', 'vlOut', null]];

  for (const g of grupos.values()) {
    g.aps = [];
    const S = g.sped, X = g.xml, Lv = g.livro;
    const base = S || X || Lv;
    const saida = base.oper === '1';
    const propria = S ? S.emit === '0' : (X ? X.propria : false);
    const docCanc = (d) => d && (LEIAUTE.sitCancelada.has(d.sit) || d.cancelada);
    // ---- integridade
    if (X && !X.pertence) add(g, 'integridade', 'xml-terceiro', 'Médio', 'XML não tem a empresa como emitente nem destinatária (CNPJ ' + U.fmtCnpj(X.partCnpj) + ')');
    if (X && !S && X.pertence) {
      const outraComp = outras && outras.get(X.chave);
      if (outraComp) add(g, 'competencia', 'xml-outra-comp', 'Baixo', 'Escriturado na competência ' + U.compShort(outraComp) + ' (emissão em ' + U.dt(X.dtDoc) + ')', { outraComp });
      else if (docCanc(X)) add(g, 'integridade', 'xml-cancelado-fora', 'Baixo', 'XML cancelado/denegado não consta no SPED (deveria constar com COD_SIT de cancelamento quando emissão própria)');
      else if (U.compOf(X.dtDoc) !== comp && !saida) add(g, 'competencia', 'xml-emissao-outra', 'Pendente de documentação', 'Entrada emitida em ' + U.dt(X.dtDoc) + ' sem escrituração neste SPED — verificar se foi lançada em outra competência');
      else add(g, 'integridade', 'xml-sem-sped', saida && X.propria ? 'Crítico' : 'Alto', (saida && X.propria ? 'Saída própria autorizada (XML) ausente no SPED — possível omissão de saída' : 'Entrada com XML ausente no SPED — possível falta de escrituração') + ' · ' + U.brl(X.vlDoc), { valor: X.vlDoc, difTrib: X.icms || 0 });
    }
    if (S && !X && temXml && S.chave && ['55', '57', '65', '67'].includes(S.mod) && !docCanc(S)) add(g, 'integridade', 'sped-sem-xml', 'Pendente de documentação', 'Documento escriturado sem XML correspondente no lote importado', { valor: S.vlDoc });
    if (temLivro && S && !Lv && !docCanc(S)) add(g, 'livro', 'sped-sem-livro', 'Médio', 'Documento no SPED ausente no livro fiscal', { valor: S.vlDoc });
    if (temLivro && Lv && !S) add(g, 'livro', 'livro-sem-sped', 'Alto', 'Documento no livro fiscal ausente no SPED · ' + U.brl(Lv.vlDoc), { valor: Lv.vlDoc || 0, difTrib: Lv.icms || 0 });
    // ---- situação
    if (S && X) {
      if (docCanc(X) && !docCanc(S)) add(g, 'integridade', 'sit-cancelada', 'Crítico', 'XML cancelado (evento ou protocolo) e SPED escriturado como regular (COD_SIT ' + S.sit + ')', { valor: S.vlDoc, difTrib: S.icms });
      if (!docCanc(X) && docCanc(S)) add(g, 'integridade', 'sit-regular', 'Alto', 'SPED como cancelado (COD_SIT ' + S.sit + '), mas o XML importado está autorizado e sem evento de cancelamento', { valor: X.vlDoc, difTrib: X.icms });
      if (S.chave && X.chave && S.num && X.num && String(parseInt(S.num, 10)) !== X.num) add(g, 'integridade', 'num', 'Baixo', 'Número divergente: SPED ' + S.num + ' × XML ' + X.num);
      if (S.ser !== undefined && X.ser && String(parseInt(S.ser || '0', 10)) !== X.ser) add(g, 'integridade', 'serie', 'Baixo', 'Série divergente: SPED ' + S.ser + ' × XML ' + X.ser);
      if (S.partCnpj && X.partCnpj && U.digits(S.partCnpj) !== U.digits(X.partCnpj)) add(g, 'integridade', 'participante', 'Médio', 'Participante divergente: SPED ' + U.fmtCnpj(S.partCnpj) + ' × XML ' + U.fmtCnpj(X.partCnpj));
      if (S.oper !== X.oper) add(g, 'classificacao', 'oper', 'Alto', 'Tipo de operação divergente: SPED ' + (S.oper === '0' ? 'entrada' : 'saída') + ' × XML ' + (X.oper === '0' ? 'entrada' : 'saída'));
    }
    // ---- chave x campos (só SPED)
    if (S && S.chave) {
      const ch = Chave.parse(S.chave);
      if (!ch || !ch.valida) add(g, 'integridade', 'chave-dv', 'Médio', 'Chave de acesso com dígito verificador inválido');
      else {
        const cnpjEsp = S.emit === '0' ? (cnpj || '') : (S.partCnpj || '');
        if (cnpjEsp && cnpjEsp.length === 14 && ch.cnpj !== cnpjEsp) add(g, 'integridade', 'chave-cnpj', 'Médio', 'CNPJ embutido na chave (' + U.fmtCnpj(ch.cnpj) + ') difere do ' + (S.emit === '0' ? 'CNPJ da empresa' : 'participante 0150') + ' (' + U.fmtCnpj(cnpjEsp) + ')');
        if (S.num && ch.nNF !== String(parseInt(S.num, 10))) add(g, 'integridade', 'chave-num', 'Baixo', 'Número embutido na chave (' + ch.nNF + ') difere de NUM_DOC (' + S.num + ')');
        if (S.mod && ch.mod !== S.mod) add(g, 'integridade', 'chave-mod', 'Baixo', 'Modelo embutido na chave (' + ch.mod + ') difere de COD_MOD (' + S.mod + ')');
      }
    }
    // ---- competência (somente SPED)
    if (S && !docCanc(S)) {
      const ce = U.compOf(S.dtES || S.dtDoc), cd = U.compOf(S.dtDoc);
      if (S.oper === '0' && cd && cd !== comp && ce === comp) add(g, 'competencia', 'entrada-emissao-anterior', 'Baixo', 'Emitido em ' + U.dt(S.dtDoc) + ', entrada em ' + U.dt(S.dtES) + ' — escrituração na data de entrada (verificar prazo de apropriação do crédito)', { valor: S.vlDoc });
      if (ce && ce !== comp) add(g, 'competencia', 'fora-periodo', 'Médio', 'Data de ' + (S.oper === '0' ? 'entrada' : 'saída') + ' (' + U.dt(S.dtES || S.dtDoc) + ') fora do período do arquivo' + (S.sit === '01' ? ' — escrituração extemporânea (COD_SIT 01)' : ''), { valor: S.vlDoc });
    }
    if (S && docCanc(S) && (S.vlDoc || S.icms)) add(g, 'integridade', 'cancelado-com-valor', 'Médio', 'Documento cancelado/denegado/inutilizado com valores preenchidos no C100');
    // ---- valores
    const comparar = (A, B, an, bn, ehEntradaTerceiro) => {
      for (const [k, nome, ka, kb] of CMP) {
        const kB = bn === 'Livro' ? kb : k;
        if (!kB) continue;
        const va = A[ka], vb = B[kB];
        if (va === null || va === undefined || vb === null || vb === undefined) continue;
        const dif = U.r2(va - vb);
        if (Math.abs(dif) <= tol) continue;
        let risco, msg = nome + ': ' + an + ' ' + U.brl(va) + ' × ' + bn + ' ' + U.brl(vb) + ' (dif. ' + U.brl(dif) + ')';
        const tributo = ['icms', 'st', 'ipi'].includes(k);
        if (ehEntradaTerceiro && (k === 'bc' || k === 'icms') && bn === 'XML') {
          // crédito escriturado pelo destinatário x destaque do emitente
          if (dif > 0) { risco = riscoValor(dif, cfg, 'Alto'); msg += ' — crédito escriturado acima do destacado'; }
          else { risco = 'Baixo'; msg += ' — crédito escriturado menor que o destacado (uso/consumo, ST, crédito vedado ou não aproveitado: confirmar)'; }
        } else if (k === 'vlDoc') risco = riscoValor(dif, cfg, 'Alto');

function issDirecaoPorTexto(t) {
  const n = U.norm(t);
  if (/servi[cç]os?\s*tomados|por:?\s*tomador\b|recebidas|tomados\b/.test(n)) return 'tomados';
  if (/servi[cç]o?s?\s*prestados|servicoprestados|por:?\s*prestador\b|emitidas|prestados\b/.test(n)) return 'prestados';

  const n = U.norm(t);

  if (/ndps|nnfse|dcompet|vserv|portal nacional|emit_cnpj|toma_cnpj/.test(n)) return 'portal';

/** dentre os valores da linha, acha (base, alíquota, ISS) consistentes: ISS ≈ base × alíquota / 100 */
function issInterpretar(nums) {
  for (let j = 1; j < nums.length - 1; j++) {
    const a = nums[j]; if (!(a > 0 && a <= 10)) continue;
    for (let i = j - 1; i >= 0; i--) {
      for (let k = j + 1; k < nums.length; k++) {
        if (Math.abs(nums[i] * a / 100 - nums[k]) <= Math.max(0.011, nums[k] * 0.0005)) {
          const base = nums[i], iss = nums[k];
          let valor = base, ded = null, totalDoc = null;
          const antes = nums.slice(0, i);
          for (let q = antes.length - 1; q >= 0; q--) if (antes[q] >= base - 0.005) { valor = antes[q]; break; }
          if (antes.length) totalDoc = antes[0];
          const meio = antes.slice(antes.indexOf(valor) + 1);
          if (meio.length && Math.abs(valor - meio[meio.length - 1] - base) <= 0.01) ded = meio[meio.length - 1];
          else if (valor - base > 0.005) ded = U.r2(valor - base);
          const depois = nums.slice(k + 1);
          return { ok: true, valor, totalDoc, ded, base, aliq: a, iss, apos: depois };
        }

  }
  return { ok: false };
}

/** linhas de texto (PDF texto/OCR) -> registros */

/** compara totais impressos com a soma lida */

    this._gravarSessao(this._sessaoDe(j));
    return this.sess;
  },
  uid() { return this.sess && this.sess.user ? this.sess.user.id : null; },
  entrar(email, senha) { return this._auth('password', { email, password: senha }); },
  /** cria a conta; se o projeto exigir confirmação por e-mail, não há sessão até a pessoa confirmar */
  async cadastrar(email, senha) {
    const r = await fetch(SB_CFG.url + '/auth/v1/signup', { method: 'POST', headers: { apikey: SB_CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: senha }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const m = j.msg || j.error_description || j.message || ('erro ' + r.status); throw new Error(/already registered|already exists/i.test(m) ? 'Este e-mail já tem conta. Use "Entrar".' : /password/i.test(m) && /6|short|weak/i.test(m) ? 'Senha fraca: use pelo menos 6 caracteres.' : /signups? not allowed|disabled/i.test(m) ? 'O cadastro de novas contas está desligado no Supabase.' : m); }
    if (j.access_token) { this._gravarSessao(this._sessaoDe(j)); return true; }
    return false;
  },
  async recuperar(email) {
    const r = await fetch(SB_CFG.url + '/auth/v1/recover', { method: 'POST', headers: { apikey: SB_CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.message || ('erro ' + r.status)); }
  },
  async renovar() { if (!this.sess || !this.sess.refresh_token) throw new Error('Sessão expirada'); return this._auth('refresh_token', { refresh_token: this.sess.refresh_token }); },
  async sair() {
    try { if (this.sess) await fetch(SB_CFG.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_CFG.key, Authorization: 'Bearer ' + this.sess.access_token } }); } catch (e) { }
    this._gravarSessao(null);
  },
  async _token() {
    if (!this.sess) throw new Error('Faça login para acessar o banco.');
    if (this.sess.expires_at - Math.floor(Date.now() / 1000) < 60) await this.renovar();
    return this.sess.access_token;
  },
  /** chamada autenticada; renova a sessão uma vez em caso de 401 */
  async req(caminho, opts = {}, tent = 0) {
    const tk = await this._token();
    const h = Object.assign({ apikey: SB_CFG.key, Authorization: 'Bearer ' + tk }, opts.headers || {});
    const r = await fetch(SB_CFG.url + caminho, Object.assign({}, opts, { headers: h }));
    if (r.status === 401 && tent === 0) { await this.renovar(); return this.req(caminho, opts, 1); }
    if (!r.ok && !opts.aceitar404) {
      let m = ''; try { const j = await r.json(); m = j.message || j.error || j.msg || ''; } catch (e) { }
      const e = new Error('Supabase ' + r.status + (m ? ': ' + m : '')); e.status = r.status; throw e;
    }
    return r;
  },

  // ---------------------------------------------------------------- documentos
  /** o Postgres (jsonb) não aceita o caractere nulo \u0000 em textos; vem às vezes de PDF/SPED — é removido */
  _limpo(data) { return JSON.parse(JSON.stringify(data, (k, v) => typeof v === 'string' && v.indexOf('\u0000') >= 0 ? v.replace(/\u0000/g, '') : v)); },
  /** JSON para o Postgres: o tipo jsonb não aceita o caractere nulo (\u0000), que aparece em trechos binários (ex.: assinatura digital do SPED) */
  json(v) { return JSON.stringify(v).replace(/(?<!\\)((?:\\\\)*)\\u0000/g, '$1'); },
  _coll(path) { const i = path.lastIndexOf('/'); return i < 0 ? '' : path.slice(0, i); },
  async get(path) {
    const r = await this.req('/rest/v1/app_docs?select=data&path=eq.' + encodeURIComponent(path) + '&limit=1');
    const j = await r.json(); return j.length ? j[0].data : null;
  },
  async set(path, data) {
    await this.req('/rest/v1/app_docs?on_conflict=owner,path', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ owner: this.uid(), path, coll: this._coll(path), data: this._limpo(data), updated_by: this.email || null }) });
  },
  async del(path) { await this.req('/rest/v1/app_docs?path=eq.' + encodeURIComponent(path), { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); },
  async list(coll) {
    const out = []; const pg = 1000;
    for (let ini = 0; ; ini += pg) {
      const r = await this.req('/rest/v1/app_docs?select=path,data&coll=eq.' + encodeURIComponent(coll) + '&order=path', { headers: { Range: ini + '-' + (ini + pg - 1), 'Range-Unit': 'items' } });
      const j = await r.json();
      j.forEach(x => out.push({ id: x.path.slice(coll.length + 1), data: x.data }));
      if (j.length < pg) break;
    }
    return out;
  },

  // ---------------------------------------------------------------- arquivos originais
  async putFile(bytes, meta) {
    const nome = String(meta.nome || 'arquivo').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_').slice(-80);
    const key = this.uid() + '/' + new Date().toISOString().slice(0, 7) + '/' + U.uid('f_') + '_' + nome;
    await this.req('/storage/v1/object/' + SB_CFG.bucket + '/' + key, { method: 'POST', headers: { 'Content-Type': meta.mime || 'application/octet-stream', 'x-upsert': 'true' }, body: bytes });
    return { kind: 'sb', key };
  },
  async getFile(ref) {
    const r = await this.req('/storage/v1/object/' + SB_CFG.bucket + '/' + ref.key.split('/').map(encodeURIComponent).join('/'));
    return new Uint8Array(await r.arrayBuffer());
  },

  // ---------------------------------------------------------------- CNPJ (CNPJá)
  /** 1) Edge Function (servidor: sem bloqueio do navegador, com cache); 2) API aberta direto do navegador */
  async cnpj(c, forcar) {
    let erroFuncao = null;
    try {
      const r = await this.req('/functions/v1/' + SB_CFG.funcaoCnpj + '?cnpj=' + c + (forcar ? '&forcar=1' : ''), { aceitar404: true });
      if (r.ok) { const j = await r.json(); return { dados: j, via: j._cache ? 'cache do Supabase (' + new Date(j._cache.consultado_em).toLocaleDateString('pt-BR') + ')' : 'CNPJá via Supabase' }; }
      let m = ''; try { const j = await r.json(); m = j.erro || j.message || j.msg || ''; } catch (e) { }
      if (r.status === 429) { const e = new Error(m || 'Limite de consultas do CNPJá atingido. Aguarde um minuto.'); e.limite = true; throw e; }
      if (r.status === 404 && /cnpj|n[aã]o encontrado|not found/i.test(m) && !/function/i.test(m)) { const e = new Error('CNPJ não encontrado no CNPJá.'); e.final = true; throw e; }
      erroFuncao = 'função "' + SB_CFG.funcaoCnpj + '" respondeu ' + r.status + (m ? ' (' + m + ')' : '');
    } catch (e) { if (e.limite || e.final) throw e; erroFuncao = erroFuncao || e.message; }
    // reserva: API aberta direto do navegador (depende do CNPJá liberar o acesso do seu domínio)
    try {
      const r = await fetch('https://open.cnpja.com/office/' + c);
      if (r.status === 429) { const e = new Error('Limite de consultas gratuitas do CNPJá (cerca de 5 por minuto). Aguarde um minuto.'); e.limite = true; throw e; }
      if (!r.ok) throw new Error('CNPJá respondeu ' + r.status);
      const j = await r.json();
      try { await this.req('/rest/v1/cnpj_cache?on_conflict=cnpj', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ cnpj: c, dados: j, fonte: 'open.cnpja.com (navegador)', consultado_por: this.email || null }) }); } catch (e) { }
      return { dados: j, via: 'CNPJá direto do navegador' };
    } catch (e) {
      if (e.limite) throw e;
      throw new Error('Não foi possível consultar: ' + erroFuncao + '; consulta direta: ' + e.message + '. Confira se a Edge Function "' + SB_CFG.funcaoCnpj + '" foi publicada no Supabase.');
    }
  },

  /** resolve true quando há sessão válida; false se a pessoa escolher usar só neste navegador */
  iniciar() {

/* =========================================================================
   Calculadora DIFAL SP — integrada a partir de difal-sp-calculadora.html
   Regras preservadas (RICMS-SP/2000, art. 117, I e II; art. 115, XV-A;
   RC 25.481/2022; LC 87/96, art. 13, §6º). Mudanças em relação ao original:
     • o estado passou a se chamar DS e a interface usa o visual do app;
     • a leitura usa o SPED já importado da competência (ou um arquivo avulso);
     • opção DESLIGADA por padrão "incluir frete/seguro/outras despesas do C100"
       (correção proposta, aguardando aprovação — não altera o cálculo se desligada);
     • regimes dos fornecedores e cálculos ficam salvos por empresa/competência.
   ========================================================================= */

const DIFAL_RULES = [
  { t: 'Entrada', d: 'Itens de entrada interestadual do SPED (CFOP 2xxx/3xxx). CFOP 1xxx aparece como interno, sem DIFAL.' },
  { t: 'Alíquota interestadual', d: 'Usa a alíquota do C170 quando houver; senão, 4% para importado (CST iniciado em 1, 2, 3 ou 8) e 12% para nacional.' },
  { t: 'Remetente RPA → Destinatário RPA', d: 'Base Dupla: DIFAL = [(V oper − ICMS origem) / (1 − ALQ interna) × ALQ interna] − (V oper × ALQ inter).' },
  { t: 'Remetente Simples Nacional → Destinatário RPA', d: 'Recompõe a base: V oper = Valor NF / (1 − ALQ inter). O crédito (V oper × ALQ inter) serve só para dedução; depois aplica a Base Dupla.' },
  { t: 'Destinatário Simples Nacional', d: 'Base Única (art. 115, XV-A): DIFAL = V oper × (ALQ interna − ALQ inter).' },
];

function difalEmptyFilters() { return { search: '', uf: new Set(), cfop: new Set(), cst: new Set(), aliq: new Set(), regime: new Set() }; }

const DS = {
  items: [], suppliers: {}, supplierRegime: {}, selectedIds: new Set(), fileName: null, company: null,
  settings: { destRegime: 'RPA', internalRate: 0.18, rateioC100: false },
  filters: difalEmptyFilters(), openFilter: null, showSuppliers: true, auditResult: null, origem: null, salvo: null,
};

function difalItemId(item) { return item.key + '::' + item.numItem; }
function getSupplierRegime(item) { return DS.supplierRegime[item.participantId] || 'RPA'; }

// ---------------------------------------------------------------- parser (original)
function difalParseNumber(val) { if (!val) return 0; const n = parseFloat(String(val).replace(',', '.')); return isNaN(n) ? 0 : n; }
function difalUfFromIbge(codMun) { if (!codMun || codMun.length < 2) return '??'; return IBGE_UF[codMun.substring(0, 2)] || '??'; }
let __difalSeed = 0;
function difalSeed() { __difalSeed += 1; return 'it_' + __difalSeed; }

function parseSpedFiscalDifal(content) {
  const lines = content.split('\n');
  const participants = {}, itemMap = {}, invoices = [];
  let company = null, currentInvoice = null;
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line || !line.startsWith('|')) continue;
    const f = line.split('|');
    const rec = f[1];
    if (rec === '0000') company = { nome: f[6] || '', cnpj: f[7] || '', uf: f[9] || '' };
    else if (rec === '0150') participants[f[2]] = { nome: f[3] || '', cnpj: f[5] || f[6] || '', uf: difalUfFromIbge(f[8] || '') };
    else if (rec === '0200') itemMap[f[2]] = { desc: f[3] || '', ncm: f[8] || '' };
    else if (rec === 'C100') {
      if (currentInvoice) invoices.push(currentInvoice);
      const indOper = f[2], codSit = f[6];
      if (indOper === '0' && (codSit === '00' || codSit === '01')) {
        const p = participants[f[4]] || {};
        currentInvoice = { participantId: f[4], number: f[8], key: f[9], date: f[10], vlDoc: difalParseNumber(f[12]), uf: p.uf || '??', items: [], resumes: [],
          // capturados apenas para a correção proposta (rateio) — não entram no cálculo original
          vlFrt: difalParseNumber(f[18]), vlSeg: difalParseNumber(f[19]), vlOutDa: difalParseNumber(f[20]) };
      } else currentInvoice = null;
    } else if (rec === 'C170' && currentInvoice) {
      const vlItem = difalParseNumber(f[7]), vlDesc = difalParseNumber(f[8]);
      const vlIcmsSt = difalParseNumber(f[18]), vlIpi = difalParseNumber(f[24]);
      const codItem = f[3];
      const info = itemMap[codItem] || { desc: '', ncm: '' };
      currentInvoice.items.push({
        numItem: f[2], codItem, descricao: info.desc || f[4] || ('Item ' + codItem), ncm: info.ncm,
        quantidade: difalParseNumber(f[5]), unidade: f[6] || '', cst: f[10] || '', cfop: f[11] || '',
        aliqIcmsSped: difalParseNumber(f[14]) / 100, vlIcms: difalParseNumber(f[15]),
        valorItem: vlItem, vlDesc, vlIcmsSt, vlIpi, valorContabil: vlItem - vlDesc + vlIcmsSt + vlIpi
      });
    } else if (rec === 'C190' && currentInvoice) {
      currentInvoice.resumes.push({ cst: f[2] || '', cfop: f[3] || '', aliq: difalParseNumber(f[4]) / 100, vlOpr: difalParseNumber(f[5]), vlIcms: difalParseNumber(f[7]) });
    }
  }
  if (currentInvoice) invoices.push(currentInvoice);
  const out = [];
  invoices.forEach(inv => {
    const dataFmt = (inv.date || '').replace(/(\d{2})(\d{2})(\d{4})/, '$1/$2/$3');
    const supplierName = (participants[inv.participantId] || {}).nome || inv.participantId;
    const base = { key: inv.key, invoiceNumber: inv.number, dtEmissao: dataFmt, ufOrigin: inv.uf, participantId: inv.participantId, supplierName };
    const sumC190 = inv.resumes.reduce((a, r) => a + r.vlOpr, 0);
    const despesas = inv.vlFrt + inv.vlSeg + inv.vlOutDa;
    if (inv.items.length > 0) {
      const sumC170 = inv.items.reduce((a, i) => a + i.valorContabil, 0);
      const sumItens = inv.items.reduce((a, i) => a + i.valorItem, 0);
      const isConferido = Math.abs(sumC170 - sumC190) < 0.10 || inv.resumes.length === 0;
      inv.items.forEach(it => {
        if (!['1', '2', '3'].some(p => it.cfop.startsWith(p))) return;
        const rateio = despesas > 0 && sumItens > 0 ? despesas * (it.valorItem / sumItens) : 0;
        out.push(Object.assign({ id: difalSeed() }, base, it, { isResumo: false, isConferido, rateioC100: rateio }));
      });
    } else {
      inv.resumes.forEach((r, idx) => {
        if (!['1', '2', '3'].some(p => r.cfop.startsWith(p))) return;
        out.push(Object.assign({ id: difalSeed() }, base, {
          numItem: 'R' + (idx + 1), codItem: 'RESUMO', descricao: 'Resumo Analítico (C190)', ncm: '', quantidade: 1, unidade: 'UN', cfop: r.cfop, cst: r.cst, aliqIcmsSped: r.aliq, vlIcms: r.vlIcms,
          valorItem: r.vlOpr, vlDesc: 0, vlIcmsSt: 0, vlIpi: 0, valorContabil: r.vlOpr, isResumo: true, isConferido: true, rateioC100: 0
        }));
      });
    }
  });
  return { items: out, participants, company };
}

// ---------------------------------------------------------------- cálculo (original)
function getInterstateRate(item) {
  if (item.aliqIcmsSped && item.aliqIcmsSped > 0) return item.aliqIcmsSped;
  const d = item.cst ? item.cst.charAt(0) : '0';
  return ['1', '2', '3', '8'].includes(d) ? 0.04 : 0.12;
}
function round2(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
/** valor contábil usado no cálculo: o original, ou com o rateio do C100 quando a correção proposta estiver ligada */
function difalValor(item) { return item.valorContabil + (DS.settings.rateioC100 ? (item.rateioC100 || 0) : 0); }

function calculateDifal(item) {
  const rate = getInterstateRate(item);
  const alqInt = DS.settings.internalRate;
  const remRegime = getSupplierRegime(item);
  const V = difalValor(item);
  const zero = { usedInterstateRate: rate, vOper: V, icmsOrigem: 0, baseCalculation: 0, difal: 0, totalPayable: 0, method: '-', remRegime, isInternal: true };
  if (item.cfop.startsWith('1')) return zero;
  if (DS.settings.destRegime === 'SN') {
    const icmsOrigem = V * rate;
    const difal = Math.max(0, V * (alqInt - rate));
    return { usedInterstateRate: rate, vOper: V, icmsOrigem, baseCalculation: V, difal, totalPayable: difal, method: 'Base Única', remRegime, isInternal: false };
  }
  const vOper = remRegime === 'SN' ? V / (1 - rate) : V;
  const icmsOrigem = vOper * rate;
  const baseCalculation = (vOper - icmsOrigem) / (1 - alqInt);
  const difal = Math.max(0, baseCalculation * alqInt - icmsOrigem);
  return { usedInterstateRate: rate, vOper, icmsOrigem, baseCalculation, difal, totalPayable: difal, method: remRegime === 'SN' ? 'Base Dupla (SN recomp.)' : 'Base Dupla', remRegime, isInternal: false };
}

function memoText(item, c) {
  if (c.isInternal) return 'Operação interna — sem DIFAL.';
  const f = n => U.brl(n), p = n => difalPct(n);
  const ai = DS.settings.internalRate;
  let s = '';
  if (DS.settings.rateioC100 && item.rateioC100) s += 'Valor contábil ' + f(item.valorContabil) + ' + rateio C100 ' + f(item.rateioC100) + ' = ' + f(difalValor(item)) + '\n';
  if (DS.settings.destRegime === 'SN') return s + 'Base Única: ' + f(c.vOper) + ' × (' + p(ai) + ' − ' + p(c.usedInterstateRate) + ') = ' + f(c.difal);
  if (c.remRegime === 'SN') s += 'V oper = ' + f(difalValor(item)) + ' / (1 − ' + p(c.usedInterstateRate) + ') = ' + f(c.vOper) + '\n';
  s += 'ICMS origem = ' + f(c.vOper) + ' × ' + p(c.usedInterstateRate) + ' = ' + f(c.icmsOrigem) + '\n';
  s += 'Base = (' + f(c.vOper) + ' − ' + f(c.icmsOrigem) + ') / (1 − ' + p(ai) + ') = ' + f(c.baseCalculation) + '\n';
  s += 'DIFAL = ' + f(c.baseCalculation) + ' × ' + p(ai) + ' − ' + f(c.icmsOrigem) + ' = ' + f(c.difal);
  return s;
}
function difalPct(v) { const n = Math.round((v || 0) * 10000) / 100; return (Number.isInteger(n) ? n : n.toFixed(2).replace('.', ',')) + '%'; }

function runLocalAudit(items) {
  const alerts = [];
  const cnt = { Alta: 0, 'Média': 0, Baixa: 0 };
  const push = (nf, severity, message, recommendation) => { alerts.push({ nf, severity, message, recommendation }); cnt[severity]++; };
  const validCfops = ['2556', '2407', '2551', '2406', '3556', '3551', '1556', '1407', '1551', '1406'];
  const ai = DS.settings.internalRate;
  if (DS.company && DS.company.uf && DS.company.uf !== 'SP') push('—', 'Alta', 'O SPED importado é de contribuinte de ' + DS.company.uf + ', não de SP.', 'Conferir se o arquivo correto foi importado.');
  items.forEach(item => {
    const c = calculateDifal(item);
    if (c.isInternal) return;
    if (!item.isConferido) push(item.invoiceNumber, 'Alta', 'Divergência entre os totais de C170 e o resumo C190.', 'Revisar a escrituração do documento no EFD.');
    if (item.ufOrigin === 'SP') push(item.invoiceNumber, 'Alta', 'CFOP interestadual ' + item.cfop + ' com fornecedor cadastrado em SP.', 'Conferir o 0150 do participante ou o CFOP da entrada.');
    const isImp = ['1', '2', '3', '8'].includes((item.cst || '0').charAt(0));
    const expected = isImp ? 0.04 : 0.12;
    if (Math.abs(c.usedInterstateRate - expected) > 0.005) push(item.invoiceNumber, 'Média', 'Alíquota interestadual ' + difalPct(c.usedInterstateRate) + ' diverge do esperado (' + difalPct(expected) + ') para CST ' + item.cst + '.', 'Confirmar a origem da mercadoria e a alíquota destacada pelo remetente.');
    if (c.remRegime === 'SN' && item.vlIcms > 0) push(item.invoiceNumber, 'Média', 'Fornecedor marcado como Simples Nacional, mas há ICMS escriturado (' + U.brl(item.vlIcms) + ').', 'Confirmar o regime do remetente; ICMS destacado sugere RPA.');
    if (ai <= c.usedInterstateRate) push(item.invoiceNumber, 'Baixa', 'Alíquota interna (' + difalPct(ai) + ') não supera a interestadual — DIFAL zerado.', 'Verificar se a alíquota interna do produto em SP está correta.');
    if (!validCfops.includes(item.cfop)) push(item.invoiceNumber, 'Baixa', 'CFOP ' + item.cfop + ' fora da lista de Uso e Consumo / Ativo Imobilizado.', 'Verificar se a operação está sujeita ao DIFAL.');
  });
  const total = items.reduce((a, i) => a + calculateDifal(i).totalPayable, 0);
  const snSup = Object.values(DS.supplierRegime).filter(v => v === 'SN').length;
  const summary = 'Foram analisados ' + items.length + ' itens com destino São Paulo, destinatário ' + (DS.settings.destRegime === 'SN' ? 'optante pelo Simples Nacional (Base Única)' : 'RPA (Base Dupla)') +
    ', alíquota interna de ' + difalPct(ai) + ' e ' + snSup + ' fornecedor(es) marcado(s) como Simples Nacional. Total apurado: ' + U.brl(total) +
    '. Alertas: ' + cnt.Alta + ' de alta, ' + cnt['Média'] + ' de média e ' + cnt.Baixa + ' de baixa severidade.' +
    (alerts.length === 0 ? ' Nenhuma inconsistência relevante identificada.' : ' Revise os itens sinalizados antes de gerar a guia.');
  return { summary, alerts: alerts.slice(0, 60), totalAlerts: alerts.length };
}

function difalFiltered() {
  const f = DS.filters, s = f.search.trim().toLowerCase();
  return DS.items.filter(item => {
    const matchSearch = !s || [item.invoiceNumber, item.key, item.cfop, item.codItem, item.descricao, item.ncm, item.supplierName].some(v => (v || '').toString().toLowerCase().includes(s));
    return matchSearch && (f.uf.size === 0 || f.uf.has(item.ufOrigin)) && (f.cfop.size === 0 || f.cfop.has(item.cfop)) && (f.cst.size === 0 || f.cst.has(item.cst)) &&
      (f.aliq.size === 0 || f.aliq.has(difalPct(getInterstateRate(item)))) && (f.regime.size === 0 || f.regime.has(getSupplierRegime(item)));
  });
}
function difalUnique(items) {
  const uf = new Set(), cfop = new Set(), cst = new Set(), aliq = new Set();
  items.forEach(i => { uf.add(i.ufOrigin); cfop.add(i.cfop); cst.add(i.cst); aliq.add(difalPct(getInterstateRate(i))); });
  return { uf: [...uf].sort(), cfop: [...cfop].sort(), cst: [...cst].sort(), aliq: [...aliq].sort((a, b) => parseFloat(a) - parseFloat(b)), regime: ['RPA', 'SN'] };
}
function difalSuppliers() {
  const map = {};
  DS.items.forEach(i => {
    if (i.cfop.startsWith('1')) return;
    const s = map[i.participantId] || (map[i.participantId] = { id: i.participantId, nome: i.supplierName, cnpj: (DS.suppliers[i.participantId] || {}).cnpj || '', uf: i.ufOrigin, nfs: new Set(), valor: 0, icms: 0 });
    s.nfs.add(i.invoiceNumber); s.valor += i.valorContabil; s.icms += i.vlIcms || 0;
  });
  return Object.values(map).sort((a, b) => b.valor - a.valor);
}

}

async function difalAcao(act, el) {
  const save = () => App.salvarRegimes();
  switch (act) {
    case 'difal-dest': DS.settings.destRegime = el.dataset.v; DS.auditResult = null; break;
    case 'difal-sup': DS.showSuppliers = !DS.showSuppliers; break;
    case 'difal-reg': DS.supplierRegime[el.dataset.id] = el.dataset.v; DS.auditResult = null; save(); break;
    case 'difal-dd': DS.openFilter = DS.openFilter === el.dataset.k ? null : el.dataset.k; break;
    case 'difal-opt': { const set = DS.filters[el.dataset.k]; set.has(el.dataset.v) ? set.delete(el.dataset.v) : set.add(el.dataset.v); break; }
