/** apaga as linhas da grade da tabela (traços longos) para o OCR não confundir bordas com dígitos */
function removerGrade(ctx, W, H, binarizar) {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const esc = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) esc[j] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) < 160 ? 1 : 0;
  const marca = new Uint8Array(W * H);
  const minH = Math.max(50, Math.round(W * 0.028)), minV = Math.max(40, Math.round(H * 0.017));
  for (let y = 0; y < H; y++) { let x0 = -1; for (let x = 0; x <= W; x++) { const v = x < W && esc[y * W + x]; if (v && x0 < 0) x0 = x; if (!v && x0 >= 0) { if (x - x0 >= minH) for (let k = x0; k < x; k++) marca[y * W + k] = 1; x0 = -1; } } }
  for (let x = 0; x < W; x++) { let y0 = -1; for (let y = 0; y <= H; y++) { const v = y < H && esc[y * W + x]; if (v && y0 < 0) y0 = y; if (!v && y0 >= 0) { if (y - y0 >= minV) for (let k = y0; k < y; k++) marca[k * W + x] = 1; y0 = -1; } } }
  for (let j = 0, i = 0; j < marca.length; j++, i += 4) { if (marca[j]) { d[i] = d[i + 1] = d[i + 2] = 255; } else if (binarizar) { const v = esc[j] ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; } }
  ctx.putImageData(img, 0, 0);
}
/* =========================================================================
   APURAÇÃO FISCAL — ajustes, lançamentos e correções do auditor
   Os originais (SPED, livro, XML) nunca são alterados: tudo aqui é uma
   camada de lançamentos com autor, data, justificativa e histórico, que
   produz a "apuração ajustada" e, se você quiser, um SPED com o Bloco E refeito.
   ========================================================================= */

const AJ_TIPOS = [
  ['0', 'Outros débitos', 'E111 · 4º caractere 0'],
  ['1', 'Estorno de créditos', 'E111 · 4º caractere 1'],
  ['2', 'Outros créditos', 'E111 · 4º caractere 2'],
  ['3', 'Estorno de débitos', 'E111 · 4º caractere 3'],
  ['4', 'Dedução do imposto apurado', 'E111 · 4º caractere 4'],
  ['5', 'Débito especial', 'E111 · 4º caractere 5'],
];
const AJ_LINHAS = [['deb', 'Total de débitos (saídas)'], ['cred', 'Total de créditos (entradas)'], ['sldAnt', 'Saldo credor do período anterior']];
const LIVRO_COLS_ED = [['vc', 'Valor contábil'], ['bc', 'Base'], ['imp', 'Imposto'], ['isen', 'Isentas/NT'], ['outras', 'Outras']];

// ---------------------------------------------------------------- cálculo (puro)
/**
 * R: resumo do SPED; rec: reconstrução; lancs: lançamentos; prevTransp: saldo credor a transportar da competência anterior (ajustada ou SPED)
 * base: 'docs' (débitos/créditos recalculados dos documentos) ou 'e110' (valores declarados)
 */
function apuracaoAjustada(R, rec, lancs, prevTransp, base) {
  const e = R.e110 || {};
  const ativos = (lancs || []).filter(l => l.ativo !== false);
  const excl = new Set(ativos.filter(l => l.tipo === 'excluir-e111').map(l => l.e111Idx));
  const e111Final = [
    ...(R.e111 || []).map((x, i) => ({ cod: x.cod, descr: x.descr, vl: x.vl, util: (x.cod || '')[3] || '?', origem: 'SPED', idx: i })).filter(x => !excl.has(x.idx)),
    ...ativos.filter(l => l.tipo === 'ajuste').map(l => ({ cod: l.cod || '', descr: l.descr || '', vl: U.r2(l.valor), util: l.util, origem: 'Lançamento', id: l.id })),
  ];
  const sumU = u => U.r2(U.sum(e111Final.filter(x => x.util === u), x => x.vl));
  const ov = {}; ativos.filter(l => l.tipo === 'substituir').sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || '')).forEach(l => { ov[l.linha] = l; });
  const calc = id => { const l = rec.linhas.find(x => x.id === id); return l ? l.calc : null; };
  const pick = (id, declarado) => ov[id] ? { v: U.r2(ov[id].valor), fonte: 'lançamento: ' + (ov[id].justif || '').slice(0, 80) } : (base === 'e110' ? { v: declarado || 0, fonte: 'declarado no E110' } : { v: calc(id) || 0, fonte: 'recalculado dos documentos' });
  const D = pick('deb', e.totDeb), C = pick('cred', e.totCred);
  const S = ov.sldAnt ? { v: U.r2(ov.sldAnt.valor), fonte: 'lançamento: ' + (ov.sldAnt.justif || '').slice(0, 80) } : (prevTransp !== null && prevTransp !== undefined ? { v: prevTransp, fonte: 'transportado da competência anterior' } : { v: e.sldAnt || 0, fonte: 'declarado no E110 (sem competência anterior)' });
  const x = {
    totDeb: D.v, ajDeb: U.r2(e.ajDeb || 0), totAjDeb: sumU('0'), estCred: sumU('1'), totCred: C.v, ajCred: U.r2(e.ajCred || 0), totAjCred: sumU('2'), estDeb: sumU('3'), sldAnt: S.v, totDed: sumU('4'), debEsp: sumU('5'),
  };
  const saldo = U.r2(x.totDeb + x.ajDeb + x.totAjDeb + x.estCred - (x.totCred + x.ajCred + x.totAjCred + x.estDeb + x.sldAnt));
  x.sldApurado = Math.max(saldo, 0);
  x.recolher = U.r2(Math.max(x.sldApurado - x.totDed, 0));
  x.transportar = U.r2(Math.max(-saldo, 0));
  const avisos = [];
  if (x.totDed > x.sldApurado + 0.005) avisos.push('As deduções (' + U.brl(x.totDed) + ') superam o saldo devedor apurado (' + U.brl(x.sldApurado) + '). O PVA rejeita VL_ICMS_RECOLHER negativo.');
  e111Final.forEach(a => { if (a.origem === 'Lançamento' && a.cod && a.cod[3] !== a.util) avisos.push('Código ' + a.cod + ' indica utilização "' + ((UTIL_AJ[a.cod[3]]) || a.cod[3]) + '", mas o lançamento é de "' + UTIL_AJ[a.util] + '".'); });
  const lista = (u) => e111Final.filter(a => a.util === u);
  const linhas = [
    { id: 'deb', nome: 'Total de débitos (saídas)', campo: 'VL_TOT_DEBITOS', sped: e.totDeb, ajust: x.totDeb, fonte: D.fonte },
    { id: 'ajDeb', nome: 'Ajustes a débito', campo: 'VL_AJ_DEBITOS + VL_TOT_AJ_DEBITOS', sped: U.r2((e.ajDeb || 0) + (e.totAjDeb || 0)), ajust: U.r2(x.ajDeb + x.totAjDeb), fonte: 'documentos (C197/D197) ' + U.brl(x.ajDeb) + ' + E111 ' + U.brl(x.totAjDeb), itens: lista('0') },
    { id: 'estCred', nome: 'Estorno de créditos', campo: 'VL_ESTORNOS_CRED', sped: e.estCred, ajust: x.estCred, itens: lista('1') },
    { id: 'cred', nome: 'Total de créditos (entradas)', campo: 'VL_TOT_CREDITOS', sped: e.totCred, ajust: x.totCred, fonte: C.fonte },
    { id: 'ajCred', nome: 'Ajustes a crédito', campo: 'VL_AJ_CREDITOS + VL_TOT_AJ_CREDITOS', sped: U.r2((e.ajCred || 0) + (e.totAjCred || 0)), ajust: U.r2(x.ajCred + x.totAjCred), fonte: 'documentos (C197/D197) ' + U.brl(x.ajCred) + ' + E111 ' + U.brl(x.totAjCred), itens: lista('2') },
    { id: 'estDeb', nome: 'Estorno de débitos', campo: 'VL_ESTORNOS_DEB', sped: e.estDeb, ajust: x.estDeb, itens: lista('3') },
    { id: 'sldAnt', nome: 'Saldo credor do período anterior', campo: 'VL_SLD_CREDOR_ANT', sped: e.sldAnt, ajust: x.sldAnt, fonte: S.fonte },
    { id: 'sldDev', nome: 'Saldo devedor apurado', campo: 'VL_SLD_APURADO', sped: e.sldApurado, ajust: x.sldApurado },
    { id: 'ded', nome: 'Deduções', campo: 'VL_TOT_DED', sped: e.totDed, ajust: x.totDed, itens: lista('4') },
    { id: 'recolher', nome: 'ICMS a recolher', campo: 'VL_ICMS_RECOLHER', sped: e.recolher, ajust: x.recolher },
    { id: 'transportar', nome: 'Saldo credor a transportar', campo: 'VL_SLD_CREDOR_TRANSPORTAR', sped: e.transportar, ajust: x.transportar },
    { id: 'debEsp', nome: 'Débitos especiais', campo: 'DEB_ESP', sped: e.debEsp, ajust: x.debEsp, itens: lista('5') },
  ];
  return { linhas, e110: x, e111Final, avisos, ativos: ativos.length };
}

// ---------------------------------------------------------------- SPED com Bloco E refeito (puro)
const CP1252 = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
function encodeCp1252(s) { const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); out[i] = c < 0x80 || (c >= 0xA0 && c <= 0xFF) ? c : (CP1252[c] || 0x3F); } return out; }
const nSped = v => (U.r2(v || 0)).toFixed(2).replace('.', ',');
const limpaTxt = s => String(s || '').replace(/[|\r\n]/g, ' ').trim();

/**
 * Reescreve somente E110, E111 (e filhos), E116 e o bloco 9 (contadores). Todas as outras linhas saem idênticas.
 * opts: { codRec, vcto (ddmmaaaa), retificadora }
 */
function gerarSpedAjustado(text, R, A, opts) {
  opts = opts || {};
  const eol = text.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
  const src = text.split(/\r?\n/).filter(l => l.length);
  const reg = l => l.split('|')[1];
  const out = []; const avisos = []; const ord9900 = []; let larg9900 = 0;
  let i = 0;
  const mantidos = new Set(A.e111Final.filter(x => x.origem === 'SPED').map(x => x.idx));
  while (i < src.length) {
    const l = src[i], r = reg(l);
    if (/^9/.test(r)) { if (r === '9900') { const f = l.split('|'); ord9900.push(f[2]); larg9900 = Math.max(larg9900, (f[3] || '').length); } i++; continue; } // bloco 9 é refeito
    if (r === '0000' && opts.retificadora) { const f = l.split('|'); f[3] = '1'; out.push(f.join('|')); i++; continue; }
    if (r === 'E110') {
      const x = A.e110;
      out.push('|E110|' + [x.totDeb, x.ajDeb, x.totAjDeb, x.estCred, x.totCred, x.ajCred, x.totAjCred, x.estDeb, x.sldAnt, x.sldApurado, x.totDed, x.recolher, x.transportar, x.debEsp].map(nSped).join('|') + '|');
      i++;
      // segmento filho do E110: E111 (+E112/E113), E115, E116
      const grupos = []; const e115 = []; const e116 = [];
      let idx = -1;
      while (i < src.length && ['E111', 'E112', 'E113', 'E115', 'E116'].includes(reg(src[i]))) {
        const rr = reg(src[i]);
        if (rr === 'E111') { idx++; grupos.push({ idx, linhas: [src[i]] }); }
        else if ((rr === 'E112' || rr === 'E113') && grupos.length) grupos[grupos.length - 1].linhas.push(src[i]);
        else if (rr === 'E115') e115.push(src[i]);
        else if (rr === 'E116') e116.push(src[i]);
        i++;
      }
      // mantém os E111 originais não excluídos (com seus E112/E113) e acrescenta os lançados
      grupos.forEach(g => { if (mantidos.has(g.idx)) g.linhas.forEach(x => out.push(x)); });
      A.e111Final.filter(x => x.origem === 'Lançamento').forEach(x => out.push('|E111|' + limpaTxt(x.cod) + '|' + limpaTxt(x.descr).slice(0, 255) + '|' + nSped(x.vl) + '|'));
      e115.forEach(x => out.push(x));
      const devido = U.r2(A.e110.recolher + A.e110.debEsp);
      if (devido > 0 && opts.codRec && opts.vcto) {
        if (A.e110.recolher > 0) out.push('|E116|000|' + nSped(A.e110.recolher) + '|' + opts.vcto + '|' + limpaTxt(opts.codRec) + '|||||' + (R.meta ? R.meta.dtIni.slice(2) : '') + '|');
        if (A.e110.debEsp > 0) out.push('|E116|090|' + nSped(A.e110.debEsp) + '|' + opts.vcto + '|' + limpaTxt(opts.codRec) + '|||||' + (R.meta ? R.meta.dtIni.slice(2) : '') + '|');
      } else if (devido > 0) {
        const soma = U.r2(e116.reduce((a, x) => a + U.n(x.split('|')[3]), 0));
        e116.forEach(x => out.push(x));
        if (Math.abs(soma - devido) > 0.005) avisos.push('E116 mantido do original soma ' + U.brl(soma) + ', mas o imposto a recolher ajustado é ' + U.brl(devido) + '. Informe código de receita e vencimento para gerar o E116 correto.');
      } else if (e116.length) avisos.push('E116 removido: a apuração ajustada não tem imposto a recolher.');
      continue;
    }
    out.push(l); i++;
  }
  if (!R.e110) avisos.push('O SPED original não tem E110; nada foi alterado no Bloco E.');
  // encerramentos de bloco (X990)
  const porBloco = {};
  out.forEach(l => { const b = reg(l)[0]; porBloco[b] = (porBloco[b] || 0) + 1; });
  for (let k = 0; k < out.length; k++) { const r = reg(out[k]); if (/^[0-9A-K]990$/.test(r) && r !== '9990') { const f = out[k].split('|'); f[2] = String(porBloco[r[0]]); out[k] = f.join('|'); } }
  // bloco 9
  const aparicao = []; const cont = {};
  out.forEach(l => { const r = reg(l); if (!(r in cont)) { cont[r] = 0; aparicao.push(r); } cont[r]++; });
  // mantém a ordem do 9900 original; registros novos entram logo após o anterior no arquivo
  const ordem = ord9900.filter(r => r in cont && !/^9/.test(r));
  aparicao.forEach((r, k) => { if (ordem.includes(r)) return; let pos = -1; for (let j = k - 1; j >= 0; j--) { const q = ordem.indexOf(aparicao[j]); if (q >= 0) { pos = q; break; } } ordem.splice(pos + 1, 0, r); });
  const regs9 = ['9001', '9900', '9990', '9999'];
  const nTipos = ordem.length + regs9.length;
  const pad = q => larg9900 > String(q).length ? String(q).padStart(larg9900, '0') : String(q);
  const b9 = ['|9001|0|'];
  ordem.forEach(r => b9.push('|9900|' + r + '|' + pad(cont[r]) + '|'));
  b9.push('|9900|9001|' + pad(1) + '|', '|9900|9900|' + pad(nTipos) + '|', '|9900|9990|' + pad(1) + '|', '|9900|9999|' + pad(1) + '|');
  b9.push('|9990|' + (b9.length + 2) + '|');
  const total = out.length + b9.length + 1;
  b9.push('|9999|' + total + '|');
  const final = [...out, ...b9];
  return { text: final.join(eol) + eol, linhas: final.length, avisos, alteradas: { e110: !!R.e110, e111Novos: A.e111Final.filter(x => x.origem === 'Lançamento').length, e111Excluidos: (R.e111 || []).length - A.e111Final.filter(x => x.origem === 'SPED').length } };
}

// ---------------------------------------------------------------- correções do livro (puro)
function aplicarCorrecoesLivro(dados, corr) {
  if (!dados) return null;
  if (!corr || (!Object.keys(corr.cfop || {}).length && !Object.keys(corr.resumo || {}).length)) return dados;
  const d = JSON.parse(JSON.stringify(dados));
  const cfops = corr.cfop || {};
  ['entradas', 'saidas'].forEach(k => d[k].forEach(row => { const c = cfops[row.cfop]; if (c) { Object.entries(c).forEach(([f, v]) => { if (v !== null && v !== undefined && v !== '') { row[f + '_orig'] = row[f]; row[f] = v; } }); row.corrigido = true; } }));
  Object.entries(cfops).forEach(([cfop, c]) => { if (!d.entradas.concat(d.saidas).some(r => r.cfop === cfop) && /^[1-7]\d{3}$/.test(cfop)) { const row = Object.assign({ cfop, vc: 0, bc: 0, imp: 0, isen: 0, outras: 0, st: null, ipi: null, origem: 'incluído manualmente', corrigido: true }, c); ('123'.includes(cfop[0]) ? d.entradas : d.saidas).push(row); } });
  Object.entries(corr.resumo || {}).forEach(([k, v]) => { if (v === null || v === undefined || v === '') return; const nome = (LIVRO_RESUMO.find(x => x[0] === k) || [k, k])[1]; d.resumo[k] = { nome, valor: v, origem: 'correção manual', rotulo: 'corrigido por ' + (corr.porNome || 'usuário'), valorOriginal: d.resumo[k] ? d.resumo[k].valor : null }; });
  d.corrigido = true;
  return d;
}

Object.assign(App, {

  lancPath(c) { return this.compPath(c) + '/lancamentos'; },
  async carregarLancs(c) {
    c = c || this.comp; if (!c || !this.eid) return [];

    catch (e) { this.lancs[this.eid + '|' + c] = []; }

  prevTransp(c) {
    const p = this.compDoc(U.prevComp(c || this.comp)); if (!p) return null;
    if (p.ajustada && p.ajustada.ativos) return p.ajustada.transportar;
    return p.sped && p.sped.resumo && p.sped.resumo.e110 ? p.sped.resumo.e110.transportar : null;
  },
  ajustada(cd, c) {
    cd = cd || this.compDoc(c); if (!cd || !cd.sped) return null;
    const R = cd.sped.resumo; const L = this.livroDados(cd);
    const ant = this.compDoc(U.prevComp(c || this.comp));
    const rec = reconstruirApuracao(R, L, ant && ant.sped ? ant.sped.resumo : null);
    return apuracaoAjustada(R, rec, this.lancsDe(c) || [], this.prevTransp(c), cd.ajusteBase || 'docs');
  },
  async gravarResumoAjustada() {
    const A = this.ajustada(); if (!A) return;
    const r = { recolher: A.e110.recolher, transportar: A.e110.transportar, deb: A.e110.totDeb, cred: A.e110.totCred, ativos: A.ativos, base: this.compDoc().ajusteBase || 'docs', em: new Date().toISOString() };

  },
  async salvarLanc(dados, id) {
    const lista = this.lancsDe() || [];
    const cur = id ? lista.find(l => l.id === id) : null;

    const doc = Object.assign({}, cur || { criadoEm: agora, criadoPor: Store.me.id, historico: [] }, dados, { atualizadoEm: agora, atualizadoPor: Store.me.id, ativo: dados.ativo === undefined ? (cur ? cur.ativo : true) : dados.ativo });

  async salvarCorrecoesLivro(corr) {

    try {
      await Store.update(this.compPath(), { livroCorr: novo }); cd.livroCorr = novo; this.concil = null;

      toast('Correções do livro salvas.', 'ok');
    } catch (e) { toast('Não foi possível salvar: ' + (e.message || e.code), 'bad'); }

  async gerarSped(opts) {
    const cd = this.compDoc(); const A = this.ajustada();
    const sem = A.e111Final.filter(x => x.origem === 'Lançamento' && !/^[A-Z]{2}[0-9][0-5]\d{4}$/.test(x.cod || ''));
    if (sem.length) return toast(sem.length + ' lançamento(s) sem código de ajuste válido (ex.: SP + 0 + utilização + 4 dígitos, conforme Tabela 5.1.1 da UF). Complete antes de gerar o SPED.', 'warn');
    const arq = this.arquivos.find(a => a.id === cd.sped.fileId);
    busy('Gerando SPED ajustado…'); await tick();
    try {
      const bytes = await Store.getFile(arq.ref);
      const { text, encoding } = U.decode(bytes);
      const g = gerarSpedAjustado(text, cd.sped.resumo, A, opts);
      const out = encoding === 'UTF-8' ? new TextEncoder().encode(g.text) : encodeCp1252(g.text);
      // confere o arquivo gerado com o próprio leitor do app
      const S2 = parseSped(U.decode(out).text);
      const erros = S2.erros.map(e => e.msg);
      const nome = arq.nome.replace(/\.txt$/i, '') + '_ajustado_' + this.comp + '.txt';
      const ref = await Store.putFile(out, { nome, tipo: 'sped-gerado', mime: 'text/plain' }).catch(() => null);
      if (ref) await Store.set(this.base() + '/arquivos/' + U.uid('a'), { tipo: 'sped-gerado', comp: this.comp, nome, tamanho: out.length, hash: await U.sha256(out), ref, versao: cd.sped.versao, ativo: false, gerado: true, origem: arq.id, importadoEm: new Date().toISOString(), importadoPor: Store.me.id, status: erros.length ? 'com erros' : 'gerado', encoding, linhas: g.linhas, lancamentos: A.ativos });
      await Store.log(this.eid, 'SPED ajustado gerado', nome + ' · E110 recalculado · ' + g.alteradas.e111Novos + ' E111 novo(s), ' + g.alteradas.e111Excluidos + ' excluído(s) · a recolher ' + U.brl(A.e110.recolher), this.comp);
      await this.recarregarComps(); await this.carregarTrilha();
      busy(null);
      this.f.spedGerado = { nome, avisos: [...g.avisos, ...erros], linhas: g.linhas };
      await this.baixar(nome, out);
    } catch (e) { busy(null); toast('Falha ao gerar: ' + (e.message || e.code), 'bad'); }
    this.render();
  },
  async definirBase(b) { try { await Store.update(this.compPath(), { ajusteBase: b }); this.compDoc().ajusteBase = b; await this.gravarResumoAjustada(); await Store.log(this.eid, 'Base da apuração ajustada', b === 'e110' ? 'valores declarados no E110' : 'recalculado dos documentos', this.comp); } catch (e) { toast('Não foi possível salvar: ' + (e.message || e.code), 'bad'); } },
});

/* =========================================================================
   Consulta de CNPJ no CNPJá (open.cnpja.com) para preencher o cadastro
   O artifact não pode chamar sites externos diretamente. Dois caminhos:
   1) automático — pelo navegador do app Claude (desktop), via host:claude_browser;
   2) manual — abre a página do CNPJá numa aba, você copia o conteúdo e cola aqui.
   ========================================================================= */
const CNPJA_URL = (c) => 'https://open.cnpja.com/office/' + U.digits(c);
const CNPJA_SITE = (c) => 'https://cnpja.com/office/' + U.digits(c);

function fmtCnae(id) { const s = String(id || '').replace(/\D/g, '').padStart(7, '0'); return s.length === 7 ? s.slice(0, 4) + '-' + s[4] + '/' + s.slice(5) : String(id || ''); }

/** extrai o JSON do texto colado/lido (pode vir com texto em volta) */
function cnpjaJson(texto) {
  if (!texto) return null;
  if (typeof texto === 'object') return texto.taxId ? texto : null;
  const s = String(texto); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { const j = JSON.parse(s.slice(a, b + 1)); return j && (j.taxId || (j.company && j.company.name)) ? j : null; } catch (e) { return null; }
}

/** JSON do CNPJá -> campos do cadastro (só o que a fonte informa; nada é inventado) */
function cnpjaParaCadastro(j, atual) {
  const ad = j.address || {}, co = j.company || {};
  const out = {}; const origem = {};
  const set = (k, v, o) => { if (v !== undefined && v !== null && String(v).trim() !== '') { out[k] = String(v).trim(); origem[k] = o; } };
  set('razao', co.name, 'company.name');
  set('fantasia', j.alias, 'alias');
  set('cnpj', j.taxId, 'taxId');
  set('uf', ad.state, 'address.state');
  set('municipio', ad.city, 'address.city');
  set('codMun', ad.municipality, 'address.municipality (IBGE)');
  if (j.mainActivity && j.mainActivity.id) set('cnae', fmtCnae(j.mainActivity.id) + ' — ' + (j.mainActivity.text || ''), 'mainActivity');
  const st = j.status && j.status.text ? U.norm(j.status.text) : '';
  const sit = SITUACOES.find(s => U.norm(s) === st) || (st ? (j.status.text) : null);
  if (sit) set('situacao', sit, 'status');
  // inscrição estadual da UF do estabelecimento (quando o CNPJá trouxer o cadastro estadual)
  const regs = Array.isArray(j.registrations) ? j.registrations : [];
  const ie = regs.find(r => r.state === ad.state && r.enabled !== false) || regs.find(r => r.state === ad.state);
  if (ie && ie.number) set('ie', U.digits(ie.number), 'registrations (' + ie.state + (ie.enabled === false ? ', não habilitada' : '') + ')');
  // regime: só o que a fonte permite afirmar
  const simei = co.simei && co.simei.optant, simples = co.simples && co.simples.optant;
  if (simei) set('regime', 'MEI', 'company.simei');
  else if (simples) set('regime', 'Simples Nacional', 'company.simples');
  const extras = {
    endereco: [ad.street, ad.number, ad.details, ad.district].filter(Boolean).join(', ') + (ad.zip ? ' · CEP ' + String(ad.zip).replace(/^(\d{5})(\d{3})$/, '$1-$2') : ''),
    natureza: co.nature ? co.nature.text : '', porte: co.size ? co.size.text : '', abertura: j.founded || '', capital: co.equity ?? null,
    telefones: (j.phones || []).map(p => '(' + p.area + ') ' + p.number).join(' · '), emails: (j.emails || []).map(e => e.address).join(' · '),
    simples: co.simples ? (co.simples.optant ? 'Optante desde ' + (co.simples.since || '?') : 'Não optante') : '', simei: co.simei ? (co.simei.optant ? 'Optante' : 'Não optante') : '',
    matriz: j.head === true ? 'Matriz' : (j.head === false ? 'Filial' : ''), situacaoData: j.statusDate || '', atualizadoFonte: j.updated || '',
    ies: regs.map(r => r.state + ' ' + r.number + (r.enabled === false ? ' (não habilitada)' : '')).join(' · '),
  };
  const avisos = [];
  if (!simples && !simei && co.simples) avisos.push('Não optante pelo Simples: confirme o regime (Lucro Real ou Presumido) — a consulta de CNPJ não informa.');
  if (!co.simples) avisos.push('A consulta não trouxe a situação no Simples Nacional; o regime foi mantido como estava.');
  if (!regs.length) avisos.push('A consulta gratuita não trouxe a inscrição estadual; preencha a IE manualmente se faltar.');
  if (sit && sit !== 'Ativa') avisos.push('Situação cadastral na Receita: ' + sit + (j.statusDate ? ' desde ' + j.statusDate.split('-').reverse().join('/') : '') + '.');
  if (atual && atual.cnpj && U.digits(atual.cnpj).length === 14 && out.cnpj && U.digits(atual.cnpj) !== out.cnpj) avisos.push('O CNPJ retornado (' + U.fmtCnpj(out.cnpj) + ') é diferente do digitado.');
  return { campos: out, origem, extras, avisos };
}

Object.assign(App, {
  cnpjBusca: null, // { estado: 'buscando'|'ok'|'erro'|'manual', msg, res, cnpj }
  async consultarCnpj() {
    const f = this.form; if (!f) return;
    const c = U.digits(f.cnpj);
    if (c.length !== 14 || !U.cnpjValido(c)) { this.cnpjBusca = { estado: 'erro', msg: 'Digite um CNPJ válido (14 dígitos) para consultar.' }; return this.render(); }
    this.cnpjBusca = { estado: 'buscando', cnpj: c, msg: 'Consultando o CNPJá pelo navegador do app…' }; this.render();
    if (Store.mode === 'supabase' && Store.sb) {
      this.cnpjBusca = { estado: 'buscando', cnpj: c, msg: 'Consultando o CNPJá…' }; this.render();
      try { const r = await Store.sb.cnpj(c, this._cnpjForcar); this._cnpjForcar = false; return this.aplicarCnpja(r.dados, r.via); }
      catch (e) { this.cnpjBusca = { estado: e.limite || e.final ? 'erro' : 'manual', cnpj: c, msg: e.message + (e.limite || e.final ? '' : ' Use a consulta manual abaixo.') }; return this.render(); }
    }
    let mcp = null; try { mcp = window.claude && await window.claude.use('mcp'); } catch (e) { mcp = null; }
    if (!mcp) { this.cnpjBusca = { estado: 'manual', cnpj: c, msg: 'A consulta automática só funciona no app Claude para desktop. Use a consulta manual abaixo.' }; return this.render(); }
    try {
      let texto = null;
      const textoDe = (r) => { if (!r) return ''; if (typeof r.payload === 'string') return r.payload; if (r.payload && typeof r.payload === 'object') return JSON.stringify(r.payload); return (r.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n'); };
      let tabId = null;
      try {
        const r = await mcp.callTool('host:claude_browser', 'preview_start', { url: CNPJA_URL(c) });
        const t = textoDe(r); const m = t.match(/tab\s*id[^0-9a-z]*([0-9a-z-]+)/i) || t.match(/"tabId"\s*:\s*"?([0-9a-z-]+)/i);
        if (m) tabId = isNaN(+m[1]) ? m[1] : +m[1];
      } catch (e) {
        if (e && ['server_not_connected', 'server_not_found', 'not_in_manifest', 'self_only', 'capability_disabled', 'not_granted', 'blocked_by_policy'].includes(e.code)) throw e;
        await mcp.callTool('host:claude_browser', 'navigate', { url: CNPJA_URL(c) });
      }
      await new Promise(r => setTimeout(r, 1200));
      for (let tent = 0; tent < 3 && !cnpjaJson(texto); tent++) {
        const r = await mcp.callTool('host:claude_browser', 'get_page_text', tabId !== null ? { tabId } : {});
        texto = textoDe(r);
        if (!cnpjaJson(texto)) await new Promise(r2 => setTimeout(r2, 1500));
      }
      const j = cnpjaJson(texto);
      if (!j) {
        const lim = /too many|limite|429|rate/i.test(texto || '');
        this.cnpjBusca = { estado: 'manual', cnpj: c, msg: lim ? 'O CNPJá recusou por limite de consultas gratuitas (cerca de 5 por minuto). Aguarde um minuto ou use a consulta manual.' : 'O CNPJá não devolveu os dados esperados para este CNPJ. Use a consulta manual abaixo.' };
        return this.render();
      }
      this.aplicarCnpja(j, 'automática (navegador do app)');
    } catch (e) {
      const code = e && e.code;
      const msg = code === 'server_not_connected' || code === 'server_not_found' ? 'O navegador do app Claude não está disponível aqui (a consulta automática só roda no app para desktop, aberta pelo dono do app).'
        : code === 'cancelled' ? 'A consulta foi cancelada no app.' : code === 'not_granted' || code === 'consent_required' ? 'A permissão para usar o navegador do app não foi concedida.' : code === 'self_only' ? 'Por enquanto só o dono do app pode usar a consulta automática.'
          : 'Não foi possível consultar automaticamente (' + (code || (e && e.message) || 'erro') + ').';
      this.cnpjBusca = { estado: 'manual', cnpj: c, msg: msg + ' Use a consulta manual abaixo.' };
    }
    this.render();
  },
  aplicarCnpja(j, via) {
    const r = cnpjaParaCadastro(j, this.form);
    Object.assign(this.form, r.campos);
    this.form.cnpjInfo = Object.assign({}, r.extras, { consultadoEm: new Date().toISOString(), via, fonte: 'CNPJá (open.cnpja.com) — dados públicos da Receita Federal' });
    this.cnpjBusca = { estado: 'ok', cnpj: U.digits(this.form.cnpj), res: r, via };
    this.render();
  },
  colarCnpja(texto) {
    const j = cnpjaJson(texto);
    if (!j) { this.cnpjBusca = Object.assign({}, this.cnpjBusca || {}, { estado: 'manual', erroCola: 'Não reconheci os dados do CNPJá no que foi colado. Na aba que abriu, selecione tudo (Ctrl+A), copie (Ctrl+C) e cole aqui.' }); return this.render(); }
    if (this.form.cnpj && U.digits(this.form.cnpj).length === 14 && U.digits(j.taxId) !== U.digits(this.form.cnpj)) { this.cnpjBusca = Object.assign({}, this.cnpjBusca || {}, { estado: 'manual', erroCola: 'Os dados colados são do CNPJ ' + U.fmtCnpj(j.taxId) + ', não do ' + U.fmtCnpj(this.form.cnpj) + '.' }); return this.render(); }
    this.aplicarCnpja(j, 'manual (colado do CNPJá)');
  },
});

const FILHOS_FIM = new Set(['C100', 'C300', 'C400', 'C500', 'C600', 'C700', 'C800', 'C990', 'D100', 'D300', 'D400', 'D500', 'D600', 'D695', 'D700', 'D750', 'D990']);

  async spedLinhas(c) {

    if (this._sped[key]) return this._sped[key];
    const arq = this.arquivos.find(a => a.id === cd.sped.fileId); if (!arq) throw new Error('arquivo do SPED não localizado no histórico');
    const bytes = await Store.getFile(arq.ref);
    const linhas = U.decode(bytes).text.split('\n').map(l => l.replace(/\r$/, ''));
    const itens0200 = {}, unid = {};
    for (const l of linhas) {
      if (l.startsWith('|0200|')) { const f = l.split('|'); itens0200[f[2]] = { descr: f[3] || '', unid: f[6] || '', tipo: f[7] || '', ncm: f[8] || '', exIpi: f[9] || '', aliq: f[12] || '', cest: f[13] || '' }; }

  },
  async carregarItens(d) {
    const k = this.eid + '|' + this.comp + '|' + d.linha;
    if (this._itens[k]) return this._itens[k];
    this._itens[k] = { estado: 'carregando' };
    try {
      const S = await this.spedLinhas();
      const ini = (d.linha || 0) - 1;
      const cab = S.linhas[ini] || '';
      if (!cab.startsWith('|' + d.reg + '|')) throw new Error('a posição do documento no arquivo não confere — reprocesse o SPED na tela de Competências');
      const itens = [], c190 = [], outros = {};
      for (let i = ini + 1; i < S.linhas.length; i++) {
        const l = S.linhas[i]; if (!l) continue;
        const f = l.split('|'); const r = f[1];
        if (FILHOS_FIM.has(r) || r[0] !== d.reg[0]) break;
        if (r === 'C170') {
          const p = S.itens0200[f[3]] || {};

      this._itens[k] = { estado: 'ok', itens, c190, outros };

const Ch = {
  barsH(rows, o = {}) {

    if (!all.length) return '<p class="muted">Sem dados.</p>';

  },
  line(cats, series, o = {}) {

      let x = lw; const y = i * rh + 6; const tot = U.sum(r.parts, p => p.v);
      const segs = r.parts.filter(p => p.v > 0).map(p => { const w = bw * p.v / max; const s = `<g data-tip="${U.esc(r.l + ' · ' + p.n + ': ' + U.brl(p.v))}"><rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(1, w - 2).toFixed(1)}" height="22" rx="3" style="fill:${p.c}"/></g>`; x += w; return s; }).join('');
      return `<text class="lab" x="${lw - 8}" y="${y + 15}" text-anchor="end">${U.esc(r.l)}</text>${segs}<text class="val" x="${x + 6}" y="${y + 15}">${U.esc(Ch.short(tot))}</text>`;
    }).join('')}</svg>` + Ch.legend(rows.flatMap(r => r.parts).filter((p, i, a) => a.findIndex(q => q.n === p.n) === i).map(p => ({ n: p.n, c: p.c })));
  },
  legend(series) { return `<div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${U.esc(s.n)}</span>`).join('')}</div>`; },
  nice(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; },
};

App.render = function () {
  if (this._rendering) { clearTimeout(this._rt2); this._rt2 = setTimeout(() => this.render(), 0); return; }
  this._rendering = true;
  try { this._render(); } finally { this._rendering = false; }
};
App._render = function () {
  const root = document.getElementById('root');
  const act = document.activeElement; const keep = act && act.id ? { id: act.id, s: act.selectionStart, e: act.selectionEnd } : null;
  const scrollY = window.scrollY;
  let body = '';
  try { body = (Views[this.view] || Views.visao)(); }
  catch (e) { console.error(e); body = `<div class="banner bad">${I.warn}<div><b>Erro ao montar a tela.</b> ${U.esc(e.message)}</div></div>`; }

};

// ---- importação
Views.importacao = function () {
  const im = App.imp;
  const drops = `<div class="drops">
    ${dropBox('sped', 'Fonte 1', 'EFD ICMS/IPI (TXT)', 'var(--s-sped)', ['Leiaute oficial, blocos 0, B, C, D, E, G, H, K, 1 e 9', 'Confere 9900, 9999 e encerramentos de bloco', 'Identifica empresa (CNPJ/IE) e competência', 'Original guardado sem alteração'], '.txt')}
    ${dropBox('livro', 'Fonte 2', 'Livros fiscais (Excel ou PDF)', 'var(--s-livro)', ['Registro de entradas, saídas e apuração (RAICMS)', 'Por CFOP ou por documento', 'Reconhece colunas; você ajusta o mapeamento', 'Resumo da apuração célula a célula'], '.xlsx,.xls,.csv,.ods,.pdf')}
    ${dropBox('xml', 'Fonte 3', 'Documentos XML', 'var(--s-xml)', ['NF-e (55/65) e CT-e de entrada e saída', 'Arquivos avulsos, lote ou ZIP', 'Eventos de cancelamento aplicados à nota', 'Duplicados contados uma única vez'], '.xml,.zip', true)}
  </div>`;
  let painel = '';
  if (im && im.erro) painel = `<div class="banner bad">${I.warn}<div>${U.esc(im.erro)}</div></div>`;
  else if (im && im.tipo === 'sped') painel = impSped(im);
  else if (im && im.tipo === 'livro') painel = impLivro(im);
  else if (im && im.tipo === 'xml') painel = impXml(im);
  const e = App.empresa();
  return head('Central de importação', 'Importação de arquivos', e ? 'Destino: <b>' + U.esc(e.fantasia || e.razao) + '</b> · ' + U.fmtCnpj(e.cnpj) + (App.comp ? ' · competência aberta ' + U.compLabel(App.comp) : '') + '. Arquivos de outro CNPJ são recusados.' : 'Nenhuma empresa selecionada: o SPED identifica a empresa pelo registro 0000.') +
    (!Store.podeEscrever ? `<div class="banner warn">${I.warn}<div>${U.esc(Store.motivo)}</div></div>` : '') + (Store.mode === 'nuvem' && !Store.podeEnviar ? `<div class="banner warn">${I.warn}<div>Seu acesso não permite guardar arquivos originais (somente editores do app). Peça acesso de edição ao dono.</div></div>` : '') + painel + drops;
};
function dropBox(t, n, titulo, cor, itens, accept, multi) {
  return `<label class="drop" data-drop="${t}" for="up-${t}"><span class="n">${n}</span><h3><span class="dot" style="background:${cor}"></span>${titulo}</h3><ul>${itens.map(i => `<li>${i}</li>`).join('')}</ul><span class="btn" style="margin-top:6px;width:fit-content">${I.up} Escolher ${multi ? 'arquivos' : 'arquivo'}</span><small class="muted">ou arraste e solte aqui</small><input type="file" id="up-${t}" data-up="${t}" accept="${accept}" ${multi ? 'multiple' : ''} hidden></label>`;
}
function impSped(im) {

// ---- apuração
Views.apuracao = function () {
  const e = App.empresa(); if (!e) return semEmpresa();
  const cd = App.compDoc(); if (!cd || !cd.sped) return head('Apuração ICMS/IPI', 'Apuração ' + (App.comp ? U.compLabel(App.comp) : '')) + semComp();
  if (!App.lancsDe()) return App.carregarLancs().then(() => null);
  const t = tabOf('apuracao', 'painel');
  const R = cd.sped.resumo, L = App.livroDados(cd);
  const ant = App.compDoc(U.prevComp(App.comp));
  const rec = reconstruirApuracao(R, L, ant && ant.sped ? ant.sped.resumo : null);
  let body = '';
  if (t === 'painel') body = apuPainel(R, L, rec, cd);
  else if (t === 'reconstrucao') body = apuReconstrucao(R, L, rec);
  else if (t === 'cfop') body = apuCfop(R, L);
  else if (t === 'blocoe') body = apuBlocoE(R, cd);
  else if (t === 'ajustes') body = apuAjustes(R, L, rec, cd);
  else body = apuEstrutura(R, cd);
  return head('Apuração ICMS/IPI · ' + U.compLabel(App.comp), U.esc(e.fantasia || e.razao), 'SPED v' + cd.sped.versao + ' · ' + U.esc(cd.sped.nomeArquivo) + (cd.livro ? ' · livro v' + cd.livro.versao + ' (' + U.esc(cd.livro.nomeArquivo) + ')' + (cd.livroCorr ? ' com correções manuais' : '') : ' · sem livro fiscal importado') + (cd.xml ? ' · ' + cd.xml.resumo.total + ' XML' : ''),
    `<button class="btn" data-act="rel-rapido" data-v="r1">${I.xls} Resumo em Excel</button>`) +

function concCfop(C, cd) {

  if (f.ap) aps = aps.filter(a => f.ap === 'abertas' ? !['Resolvida', 'Justificada (sem ajuste)'].includes(a.pst) : a.pst === f.ap);
  if (f.aq) { const q = f.aq.toLowerCase(); aps = aps.filter(a => (a.msg + ' ' + a.num + ' ' + a.chave + ' ' + (a.cfop || '')).toLowerCase().includes(q)); }
  aps.sort((a, b) => RISCOS.indexOf(a.risco) - RISCOS.indexOf(b.risco) || (b.valor || 0) - (a.valor || 0));
  const docsDiv = C.linhas.filter(l => l.status === 'Divergente').length;
  const lr = C.rec ? C.rec.linhas.find(x => x.id === 'recolher') : null;
  const difApu = lr && lr.sped !== null && lr.sped !== undefined ? U.r2(Math.abs(lr.sped - Math.max(lr.calc || 0, lr.livro || 0))) : 0;
  const riscoKpi = (r) => kpi(r, String(C.porRisco[r] || 0), r === 'Pendente de documentação' ? 'falta documento para concluir' : '', 'click sev sev-' + SEV[r], '', 'filtro-risco" data-v="' + r);
  const head1 = head('Auditoria e divergências · ' + U.compLabel(App.comp), 'Apontamentos', 'Cada apontamento leva aos documentos e registros que o originaram. Registre a conclusão, a providência, o responsável e o status.', `<button class="btn" data-act="rel-rapido" data-v="r3">${I.xls} Exportar</button>`);
  const indic = `<div class="kpis">${kpi('Documentos analisados', String(k.analisados), 'união das três fontes', '')}${kpi('Conciliados', String(k.conciliados), U.pct(k.pct, 1) + ' incluindo competência', 'sev sev-ok')}${kpi('Com divergência', String(docsDiv), '', docsDiv ? 'sev sev-alto' : '')}${kpi('Pendentes de validação', String(k.pendentes), 'sem documento correspondente', 'sev sev-pend')}${kpi('Valor das diferenças', U.brl(k.valorDif), 'documentos', '')}${kpi('Potencial diferença tributária', U.brl(k.difTrib + difApu), 'documentos ' + U.brl(k.difTrib) + ' + apuração ' + U.brl(difApu) + ' · não presume tributo devido', '')}</div>
    <div class="kpis">${RISCOS.map(riscoKpi).join('')}</div>`;
  const porClasse = Object.entries(C.porClasse).sort((a, b) => b[1] - a[1]);
  const charts = `<div class="grid2"><section class="card"><h3>Inconsistências por tipo</h3><div style="margin-top:8px">${Ch.barsH(porClasse.map(([c, v]) => ({ l: CLASSES[c] || c, v, tip: (CLASSES[c] || c) + ': ' + v })), { fmt: v => String(v), lw: 150 })}</div></section>
    <section class="card"><h3>Status das análises</h3><div style="margin-top:8px">${Ch.barsH(STATUS_PEND.map(s => ({ l: s, v: C.aps.filter(a => ((App.pend[a.id] || {}).status || 'Aberta') === s).length, c: s === 'Resolvida' || s.startsWith('Justificada') ? 'var(--ok)' : 'var(--accent)' })), { fmt: v => String(v), lw: 150 })}</div></section></div>`;
  const selx = (id, v, label, opts) => `<select class="inp" id="${id}" data-fx="${id.replace('f-', '')}"><option value="">${label}</option>${opts.map(o => `<option value="${U.esc(o[0])}" ${v === o[0] ? 'selected' : ''}>${U.esc(o[1])}</option>`).join('')}</select>`;
  const filtros = `<section class="card"><div class="row gap8 wrap aic"><input class="inp grow" id="f-aq" data-fx="aq" placeholder="Buscar no texto, número, chave ou CFOP" value="${U.esc(f.aq || '')}">${selx('f-ar', f.ar, 'Todos os riscos', RISCOS.map(r => [r, r]))}${selx('f-ac', f.ac, 'Todos os tipos', Object.keys(CLASSES).map(c => [c, CLASSES[c]]))}${selx('f-ap', f.ap, 'Qualquer status', [['abertas', 'Em aberto'], ...STATUS_PEND.map(s => [s, s])])}${f.ar || f.ac || f.ap || f.aq ? '<button class="btn ghost sm" data-act="limpar-aud">Limpar</button>' : ''}<span class="muted">${aps.length} de ${total}</span></div></section>`;
  const lista = `<section class="card pad0"><div class="aplist">${aps.slice(0, App.f.alim || 80).map(a => `<div class="ap sev-${SEV[a.risco]} ${App.sel === a.id ? 'sel' : ''}" data-act="ap-abrir" data-id="${a.id}" tabindex="0" role="button"><span class="bar"></span><div><div class="m">${U.esc(a.msg)}</div><div class="meta"><span>${CLASSES[a.classe] || a.classe}</span>${a.num ? '<span>Doc. ' + U.esc(a.num) + '</span>' : ''}${a.cfop ? '<span>CFOP ' + a.cfop + '</span>' : ''}${App.pend[a.id] && App.pend[a.id].responsavel ? '<span>Resp.: ' + U.esc(App.pend[a.id].responsavel) + '</span>' : ''}</div></div><div class="rt">${pill(a.risco)}<span class="chip ${['Resolvida', 'Justificada (sem ajuste)'].includes(a.pst) ? 'ok' : a.pst === 'Aberta' ? 'off' : 'warn'}">${U.esc(a.pst)}</span></div></div>`).join('') || '<p class="note pad">Nenhum apontamento com esses filtros.</p>'}</div>${aps.length > (App.f.alim || 80) ? `<div class="row gap8 aic" style="padding:12px 16px"><span class="muted">Exibindo ${App.f.alim || 80} de ${aps.length}</span><button class="btn sm" data-act="aud-mais">Mostrar mais 100</button></div>` : ''}</section>`;
  return head1 + indic + charts + filtros + lista;
};

// ---- painel lateral (lado a lado + análise)
function drawerHtml() {
  const d = App.drawer; const C = App.concil;

    const l = C && C.linhas.find(x => x.k === (d.k || d.ap.k));

    else {
      titulo = (l.oper === '0' ? 'Entrada' : 'Saída') + ' · documento ' + U.esc(l.num || '');
      corpo = ladoALado(l) + itensDocHtml(l) + (l.aps.length ? `<section><h4>Apontamentos deste documento</h4><div class="aplist" style="margin-top:6px">${l.aps.map(a => `<div class="ap sev-${SEV[a.risco]} ${d.ap && d.ap.id === a.id ? 'sel' : ''}" data-act="ap-abrir" data-id="${a.id}"><span class="bar"></span><div class="m">${U.esc(a.msg)}</div><div class="rt">${pill(a.risco)}</div></div>`).join('')}</div></section>` : '<div class="banner ok">' + I.ok + '<div>Sem divergências entre as fontes disponíveis.</div></div>');
    }
  } else if (d.tipo === 'ap' && d.ap) {

function ladoALado(l) {
  const X = l.xml, Lv = l.livro, S = l.sped, tol = App.cfg.tol;
  const sitN = d => d ? (d.cancelada ? 'Cancelado (evento/protocolo)' : (LEIAUTE.sit[d.sit] || d.sit || '')) : null;
  const linhas = [
    ['Chave de acesso', d => d.chave || '', 'txt'], ['Modelo · série · número', d => [d.mod, d.ser, d.num].filter(x => x !== undefined && x !== null && x !== '').join(' · '), 'txt'], ['Situação', sitN, 'txt'], ['Emissão', d => U.dt(d.dtDoc), 'txt'], ['Entrada/saída', d => d.dtES ? U.dt(d.dtES) : '', 'txt'],
    ['CNPJ/CPF participante', d => U.fmtCnpj(d.partCnpj), 'txt'], ['Participante', d => d.partNome || '', 'txt'], ['UF', d => d.partUf || '', 'txt'],
    ['CFOP', d => d.src === 'XML' ? (d.cfops || []).join(', ') : d.src === 'LIVRO' ? (d.cfops || [d.cfop]).join(', ') : [...new Set((d.an || []).map(a => a[1]))].join(', '), 'txt'],
    ['CST', d => d.src === 'XML' ? (d.csts || []).join(', ') : d.src === 'SPED' ? [...new Set((d.an || []).map(a => a[0]))].join(', ') : '', 'txt'],
    ['Valor total', d => d.vlDoc, 'n'], ['Valor dos produtos', d => d.src === 'LIVRO' ? null : d.vlMerc, 'n'], ['Base de cálculo ICMS', d => d.bc, 'n'], ['ICMS', d => d.icms, 'n'], ['Base ICMS-ST', d => d.src === 'LIVRO' ? null : d.bcSt, 'n'], ['ICMS-ST', d => d.st, 'n'], ['IPI', d => d.ipi, 'n'], ['Frete', d => d.src === 'LIVRO' ? null : d.vlFrt, 'n'], ['Descontos', d => d.src === 'LIVRO' ? null : d.vlDesc, 'n'], ['Outras despesas', d => d.src === 'LIVRO' ? null : d.vlOut, 'n'], ['FCP', d => d.src === 'XML' ? d.fcp : (d.src === 'SPED' ? d.fcp : null), 'n'],
  ];
  const cols = [['xml', 'XML', X], ['livro', 'Livro', Lv], ['sped', 'SPED', S]];
  return `<div class="tblwrap"><table class="tbl dense side3"><thead><tr><th>Campo</th>${cols.map(c => `<th class="${c[0]}">${c[1]}${c[2] ? '' : ' <small class="muted">(ausente)</small>'}</th>`).join('')}</tr></thead><tbody>${linhas.map(([n, fn, t]) => {
    const vals = cols.map(c => c[2] ? fn(c[2]) : undefined);
    const nums = vals.filter(v => typeof v === 'number');
    const diverge = t === 'n' && nums.length > 1 && (Math.max(...nums) - Math.min(...nums)) > tol;
    return `<tr><td>${n}</td>${vals.map((v, i) => { if (v === undefined) return `<td class="${cols[i][0]} na">—</td>`; if (v === null || v === '') return `<td class="${cols[i][0]} na">n/d</td>`; return `<td class="${cols[i][0]} ${t === 'n' ? 'r mono' : (n.startsWith('Chave') ? 'mono' : '')} ${diverge ? 'diff' : ''}" style="${n.startsWith('Chave') ? 'font-size:10.5px;word-break:break-all' : ''}">${t === 'n' ? U.brl(v) : U.esc(v)}</td>`; }).join('')}</tr>`;
  }).join('')}</tbody></table></div><p class="note">Entradas de terceiros: base e ICMS do SPED são o crédito escriturado pelo destinatário e podem diferir legitimamente do destaque do emitente (uso e consumo, ST, crédito vedado). ${X && X.arquivo ? 'Arquivo XML: ' + U.esc(X.arquivo) : ''}</p>`;
}
function cfopTres(c) {

// ---- evolução
Views.evolucao = function () {
  const e = App.empresa(); if (!e) return semEmpresa();
  const grupo = App.empresas.filter(x => x.raiz === e.raiz);
  if (App.consolidar && grupo.length > 1 && !App._grupo) { return (async () => { const out = {}; for (const g of grupo) { const l = await Store.list('empresas/' + g.id + '/competencias'); out[g.id] = l; } App._grupo = out; })(); }
  const fonte = App.consolidar && App._grupo ? App._grupo : { [e.id]: App.comps };
  const map = {};
  Object.values(fonte).forEach(lista => lista.forEach(c => { const d = c.data; const m = map[c.id] || (map[c.id] = { comp: c.id, deb: null, cred: null, rec: null, transp: null, saiVC: null, entVC: null, pct: null, crit: null, difal: null, n: 0 }); m.n++; const e1 = d.sped && d.sped.resumo && d.sped.resumo.e110; const add = (k, v) => { if (v === null || v === undefined) return; m[k] = (m[k] || 0) + v; }; if (e1) { add('deb', e1.totDeb); add('cred', e1.totCred); add('rec', e1.recolher); add('transp', e1.transportar); add('saiVC', d.sped.resumo.totais.saiVC); add('entVC', d.sped.resumo.totais.entVC); } if (d.concil) { m.pct = m.pct === null ? d.concil.kpis.pct : (m.pct + d.concil.kpis.pct) / 2; add('crit', d.concil.criticos); } if (d.difal) add('difal', d.difal.total); }));
  const rows = Object.values(map).sort((a, b) => a.comp.localeCompare(b.comp));
  const cats = rows.map(r => U.compShort(r.comp));
  return head('Evolução histórica', App.consolidar ? 'Grupo ' + e.raiz + ' · ' + grupo.length + ' estabelecimentos' : U.esc(e.fantasia || e.razao), 'Débitos, créditos, recolhimentos e conciliação por competência, a partir do E110 de cada SPED importado.', grupo.length > 1 ? `<label class="check"><input type="checkbox" id="consolidar" ${App.consolidar ? 'checked' : ''}> Consolidar matriz e filiais (raiz ${e.raiz})</label>` : '') +
    (rows.length < 1 ? semComp() : `<div class="grid2"><section class="card"><h3>Débitos × créditos</h3><div style="margin-top:8px">${Ch.line(cats, [{ n: 'Débitos (E110)', c: 'var(--deb)', v: rows.map(r => r.deb) }, { n: 'Créditos (E110)', c: 'var(--cred)', v: rows.map(r => r.cred) }])}</div></section>
    <section class="card"><h3>ICMS a recolher e saldo credor</h3><div style="margin-top:8px">${Ch.line(cats, [{ n: 'A recolher', c: 'var(--accent)', v: rows.map(r => r.rec) }, { n: 'Saldo credor a transportar', c: 'var(--s-xml)', v: rows.map(r => r.transp) }])}</div></section></div>
    <div class="grid2"><section class="card"><h3>Faturamento (saídas) e entradas</h3><div style="margin-top:8px">${Ch.line(cats, [{ n: 'Saídas', c: 'var(--deb)', v: rows.map(r => r.saiVC) }, { n: 'Entradas', c: 'var(--cred)', v: rows.map(r => r.entVC) }])}</div></section>
    <section class="card"><h3>Conciliação documental</h3><div style="margin-top:8px">${rows.some(r => r.pct !== null) ? Ch.line(cats, [{ n: '% conciliado', c: 'var(--ok)', v: rows.map(r => r.pct) }], { max: 1, pct: true, fmt: v => U.pct(v, 1) }) : '<p class="muted">Abra a auditoria de cada competência para calcular.</p>'}</div></section></div>
    <section class="card pad0"><div class="hrow"><h3>Tabela por competência</h3><button class="btn sm" data-act="rel-rapido" data-v="r4">${I.xls} Excel</button></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Competência</th><th class="r">Saídas</th><th class="r">Entradas</th><th class="r">Débitos</th><th class="r">Créditos</th><th class="r">A recolher</th><th class="r">Saldo credor</th><th class="r">DIFAL</th><th class="r">Conciliação</th><th class="r">Críticos</th></tr></thead><tbody>${rows.slice().reverse().map(r => `<tr><td><b>${U.compLabel(r.comp)}</b>${App.consolidar ? '<br><small class="muted">' + r.n + ' estab.</small>' : ''}</td><td class="r mono">${money(r.saiVC)}</td><td class="r mono">${money(r.entVC)}</td><td class="r mono">${money(r.deb)}</td><td class="r mono">${money(r.cred)}</td><td class="r mono b">${money(r.rec)}</td><td class="r mono">${money(r.transp)}</td><td class="r mono">${money(r.difal)}</td><td class="r mono">${r.pct === null ? '—' : U.pct(r.pct, 1)}</td><td class="r">${r.crit === null ? '—' : r.crit}</td></tr>`).join('')}</tbody></table></div><p class="note pad">Fonte: E110 do SPED ativo de cada competência; conciliação e críticos gravados na última abertura da auditoria.</p></section>`);
};

/** OCR: combina duas leituras — para cada nota, fica com a versão cujos valores são coerentes (ISS = base × alíquota) e mantém os totais impressos */
function issCombinarLeituras(passes) {
  const ps = passes.map(ls => ({ ls, r: issParseLinhas(ls, null) }));
  const ok = (rec) => rec && (rec.sit === 'cancelada' || (rec.base !== null && rec.aliq !== null && rec.iss !== null && Math.abs(rec.base * rec.aliq / 100 - rec.iss) <= 0.011 && (rec.valor === null || rec.valor >= rec.base - 0.01)));
  const base = ps[0];
  const alt = new Map(); ps.slice(1).forEach(p => p.r.registros.forEach((rec, i) => { if (ok(rec)) alt.set(rec.num, { rec, txt: null }); }));
  // reconstrói como linhas: troca a linha de texto da nota problemática pela linha da outra leitura
  const linhaDe = (ls, num) => ls.find(l => { const m = limparLinhaNum(l.txt).match(/^\s*(\d{1,9})\b/); return m && String(parseInt(m[1], 10)) === num; });
  const novas = base.ls.map(l => {
    const m = limparLinhaNum(l.txt).match(/^\s*(\d{1,9})\b/); if (!m) return l;
    const num = String(parseInt(m[1], 10));
    const rec = base.r.registros.find(x => x.num === num);
    if (rec && !ok(rec) && alt.has(num)) { for (const p of ps.slice(1)) { const l2 = linhaDe(p.ls, num); if (l2) return Object.assign({}, l, { txt: l2.txt }); } }
    return l;
  });
  // notas que só a segunda leitura reconheceu
  const nums = new Set(base.r.registros.map(x => x.num));
  ps.slice(1).forEach(p => p.r.registros.forEach(rec => { if (!nums.has(rec.num) && ok(rec)) { const l2 = linhaDe(p.ls, rec.num); if (l2) { novas.push(l2); nums.add(rec.num); } } }));
  const r2 = issParseLinhas(novas, null);
  return r2.conferencia.problemas.length <= base.r.conferencia.problemas.length ? novas : null;
}
/* =========================================================================
   Obrigações mensais e acessos às prefeituras
   - cadastro (por empresa): portal, usuário, senha, dia de vencimento de cada obrigação
   - status (por empresa e competência): Pendente / Em andamento / Enviado / Não se aplica,
     com responsável, data de envio e observação — coleção "obrig", doc <eid>__<comp>
   - importação da planilha de empresas (vencimentos, status e acessos dos comentários)
   ========================================================================= */
const OBRIG = [
  { k: 'issqn', l: 'ISSQN', esfera: 'Municipal', onde: 'Portal da prefeitura' },
  { k: 'icms', l: 'ICMS', esfera: 'Estadual', onde: 'GARE-ICMS (SEFAZ)' },
  { k: 'ret', l: 'Retenções', esfera: 'Federal', onde: 'DARF (DCTFWeb / Sicalc)' },
  { k: 'efd', l: 'EFD ICMS/IPI', esfera: 'Estadual', onde: 'PVA EFD ICMS/IPI → SPED' },
  { k: 'reinf', l: 'EFD-Reinf', esfera: 'Federal', onde: 'EFD-Reinf (e-CAC)' },
];
const OB_STATUS = ['Pendente', 'Em andamento', 'Enviado', 'Não se aplica'];
const OB_CLS = { 'Pendente': 'bad', 'Em andamento': 'warn', 'Enviado': 'ok', 'Não se aplica': 'off' };
const obNorm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function obStatusDe(v) {
  const n = obNorm(v); if (!n) return null;
  if (/^envia|^entreg|^transm|^ok$|^conclu|^feito/.test(n)) return 'Enviado';
  if (/andamento|^em /.test(n)) return 'Em andamento';
  if (/nao se aplica|^n\/?a$|dispensad|sem movimento/.test(n)) return 'Não se aplica';
  if (/pendent|^a fazer|^aberto/.test(n)) return 'Pendente';
  return null;
}
/** data de vencimento: dia informado no mês seguinte ao da competência */
function obVenc(comp, dia) {
  const d = parseInt(dia, 10); if (!comp || !d) return null;
  const [a, m] = U.nextComp(comp).split('-').map(Number);
  const ult = new Date(a, m, 0).getDate();
  return a + '-' + String(m).padStart(2, '0') + '-' + String(Math.min(d, ult)).padStart(2, '0');
}
const obHoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const obDataBr = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
function obPrazo(st, venc) {
  if (!venc || st === 'Enviado' || st === 'Não se aplica') return null;
  const dias = Math.round((new Date(venc + 'T12:00') - new Date(obHoje() + 'T12:00')) / 864e5);
  if (dias < 0) return { cls: 'bad', t: 'atrasada ' + (-dias) + 'd' };
  if (dias === 0) return { cls: 'bad', t: 'vence hoje' };
  if (dias <= 5) return { cls: 'warn', t: 'vence em ' + dias + 'd' };
  return null;
}

  // ---------------------------------------------------------------- importação da planilha
  async obImportar(file) {
    busy('Lendo planilha de empresas…'); await tick();
    try {
      const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellComments: true });
      let melhor = null;
      for (const nome of wb.SheetNames) {
        const ws = wb.Sheets[nome]; if (!ws['!ref']) continue;
        const rg = XLSX.utils.decode_range(ws['!ref']);
        for (let r = rg.s.r; r <= Math.min(rg.s.r + 10, rg.e.r); r++) {
          const map = {};
          for (let c = rg.s.c; c <= rg.e.c; c++) {
            const cel = ws[XLSX.utils.encode_cell({ r, c })]; const h = obNorm(cel && cel.v);
            if (!h) continue;
            if (/^cnpj/.test(h)) map.cnpj = c;
            else if (/razao/.test(h)) map.razao = c;
            else if (/fantasia/.test(h)) map.fantasia = c;
            else if (/insc.*est|^ie$/.test(h)) map.ie = c;
            else if (/^uf$/.test(h)) map.uf = c;
            else if (/municipio|cidade/.test(h)) map.municipio = c;
            else if (/regime/.test(h)) map.regime = c;
            else if (/^venc/.test(h)) {
              if (/reinf/.test(h)) map['d-reinf'] = c; else if (/efd|sped/.test(h)) map['d-efd'] = c; else if (/iss/.test(h)) map['d-issqn'] = c; else if (/icms/.test(h)) map['d-icms'] = c; else if (/retenc/.test(h)) map['d-ret'] = c;
            }
            else if (/^(issqn|iss)$/.test(h)) map['s-issqn'] = c;
            else if (/^icms$/.test(h)) map['s-icms'] = c;
            else if (/^(efd icms|efd icms\/ipi|sped fiscal)$/.test(h)) map['s-efd'] = c;
            else if (/^(efd reinf|reinf|efd-reinf)$/.test(h)) map['s-reinf'] = c;
            else if (/^retenc/.test(h)) map['s-ret'] = c;
            else if (/portal|site|url/.test(h)) map.url = c;
            else if (/usuario|login/.test(h)) map.usuario = c;
            else if (/senha/.test(h)) map.senha = c;
          }
          const n = Object.keys(map).length;
          if (map.cnpj !== undefined && n >= 3 && (!melhor || n > melhor.n)) melhor = { nome, ws, rg, hdr: r, map, n };
        }
      }
      if (!melhor) throw new Error('não encontrei uma aba com cabeçalho de CNPJ e colunas de vencimento ou status.');
      const { ws, rg, hdr, map } = melhor;
      const val = (r, k) => { if (map[k] === undefined) return null; const cel = ws[XLSX.utils.encode_cell({ r, c: map[k] })]; return cel ? cel.v : null; };
      const linhas = [];
      for (let r = hdr + 1; r <= rg.e.r; r++) {
        const cnpj = U.digits(val(r, 'cnpj')); if (cnpj.length !== 14) continue;
        // acessos: colunas próprias ou comentário em qualquer célula da linha
        let url = val(r, 'url') || '', usuario = val(r, 'usuario') || '', senha = val(r, 'senha') || '', origem = '';
        if (!url) for (let c = rg.s.c; c <= rg.e.c; c++) {
          const cel = ws[XLSX.utils.encode_cell({ r, c })];
          if (!cel || !cel.c || !cel.c.length) continue;
          const txt = cel.c.map(x => x.t || '').join('\n');
          let ls = txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          let autor = (cel.c[0].a && !/unknown/i.test(cel.c[0].a)) ? cel.c[0].a : '';
          if (ls.length && /:$/.test(ls[0]) && !/https?:/i.test(ls[0])) { if (!autor) autor = ls[0].replace(/:$/, ''); ls = ls.slice(1); }
          const iu = ls.findIndex(s => /https?:\/\//i.test(s));
          if (iu < 0) continue;
          url = ls[iu]; const resto = ls.filter((_, i) => i !== iu);

        linhas.push({ cnpj, razao: String(val(r, 'razao') || '').trim(), fantasia: String(val(r, 'fantasia') || '').trim(), ie: U.digits(val(r, 'ie')), uf: String(val(r, 'uf') || '').trim().toUpperCase().slice(0, 2), municipio: String(val(r, 'municipio') || '').trim(), regime: String(val(r, 'regime') || '').trim(), url: String(url).trim(), usuario: String(usuario).trim(), senha: String(senha).trim(), origem, dias, status, valido: U.cnpjValido(cnpj) });
      }
      if (!linhas.length) throw new Error('nenhuma linha com CNPJ foi encontrada na aba ' + melhor.nome + '.');

      const porCred = U.groupBy(linhas.filter(l => l.usuario), l => l.usuario + '|' + l.senha);
      linhas.forEach(l => { const g = porCred.get(l.usuario + '|' + l.senha); if (l.usuario && g && g.length > 1) l.aviso = 'mesmo usuário e senha de ' + g.filter(x => x !== l).map(x => U.fmtCnpj(x.cnpj).slice(-7)).join(', '); });

  },
  async obConfirmar() {

    busy('Gravando obrigações e acessos…'); await tick();
    const regimeDe = s => { const n = obNorm(s); if (/real/.test(n)) return REGIMES[0]; if (/presumido/.test(n)) return REGIMES[1]; if (/simples/.test(n)) return REGIMES[2]; if (/mei/.test(n)) return 'MEI'; return n ? 'Outro' : REGIMES[0]; };

        }
        if (im.gravarStatus && im.comp && Object.keys(l.status).length) {
          const itens = Object.assign({}, this.obItens(id, im.comp));
          Object.entries(l.status).forEach(([k, s]) => { itens[k] = Object.assign({}, itens[k] || {}, { status: s, por: Store.me.id || null, em: agora, origem: 'planilha' }); });

/* =========================================================================
   Devolutiva da conferência de NFS-e (Excel com formatação, via ExcelJS)
   Abas: Resumo · Comparativo (nota a nota, com destaque por tipo) · Divergências (com ação sugerida) · Apontamentos
   A NFS-e (Portal Nacional) é a referência "correta" quando importada.
   ========================================================================= */
const DEV_COR = { erro: 'FFF8CBAD', aliq: 'FFFCE4D6', vinculo: 'FFFFF2CC', desconto: 'FFDDEBF7' };
const DEV_NUM = '#,##0.00;\\(#,##0.00\\);\\-';

function devCategoria(g) {
  const reais = g.aps.filter(a => !a.info || a.regra === 'desconto');
  const tem = re => reais.some(a => re.test(a.regra));
  const aliq = reais.some(a => a.regra === 'v-aliq' || a.aliqEf);
  if (reais.some(a => !a.info && !(a.aliqEf || a.regra === 'v-aliq') && !/^sem-nfse|^desconto|^comp-|^lacuna/.test(a.regra))) return 'erro';
  if (aliq) return 'aliq';
  if (tem(/^sem-nfse/)) return 'vinculo';
  if (tem(/^desconto/)) return 'desconto';
  return null;
}
function devAcao(a, g, nomeF, refF) {
  nomeF = { portal: 'Portal', prefeitura: 'livro/relatório da prefeitura', livro: 'livro fiscal (sistema)' };
  const f = (a.regra.match(/-(livro|portal|prefeitura)$/) || [])[1]; const nf = f ? nomeF[f] : '';
  const pres = ['livro', 'portal', 'prefeitura'].filter(x => g[x]);
  if (a.regra === 'situacao') { const canc = pres.filter(x => g[x].sit === 'cancelada'), reg = pres.filter(x => g[x].sit !== 'cancelada'); return refF && g[refF] && g[refF].sit === 'cancelada' ? 'Retificar o ' + reg.map(x => nomeF[x]).join(' e ') + ': escriturar a NF ' + g.num + ' como cancelada' : 'Verificar o cancelamento no ' + canc.map(x => nomeF[x]).join(' e ') + ' (regular no ' + reg.map(x => nomeF[x]).join(' e ') + ')'; }
  if (/^sem-nfse/.test(a.regra)) return 'Vincular no ' + nf + ' o nº/série da NFS-e emitida no portal';
  if (/^num-dps/.test(a.regra)) return 'Corrigir no ' + nf + ' o nº da NFS-e vinculado à nota';
  if (/^num-cruz/.test(a.regra)) return 'Corrigir no ' + nf + ' o vínculo nota × NFS-e (tomador/valor/nº NFS-e) das notas envolvidas';
  if (/^num-vinc/.test(a.regra)) return 'Corrigir no ' + nf + ' tomador/valor/vínculo da NFS-e ' + g.num;
  if (a.regra === 'v-aliq' || a.aliqEf) { const r = refF && g[refF]; const t = r ? (r.aliq !== null && r.aliq !== undefined ? r.aliq : (r.base > 0 ? Math.round(r.iss / r.base * 1000) / 10 : null)) : null; return 'Ajustar o ISS para a alíquota da NFS-e' + (t !== null ? ' (' + U.num(t, t % 1 ? 1 : 0) + '%)' : '') + ' — diferença a provisionar'; }
  if (/^v-/.test(a.regra)) return 'Conferir e corrigir os valores da NF ' + g.num;
  if (/^falta-/.test(a.regra)) return refF && g[refF] ? 'Escriturar a NF ' + g.num + ' no ' + nf : 'Verificar a emissão da NFS-e ' + g.num + ' (consta só no ' + pres.map(x => nomeF[x]).join(' e ') + ')';
  if (/^dup-/.test(a.regra)) return 'Excluir o lançamento repetido no ' + nf;
  if (a.regra === 'retencao') return 'Conferir a retenção do ISS (define quem recolhe)';
  if (a.regra === 'participante') return 'Corrigir o tomador/prestador no cadastro';
  if (a.regra === 'local') return 'Conferir o local de incidência';
  if (/^cod-serv/.test(a.regra)) return 'Corrigir o código de serviço no ' + nf;
  if (/^comp-/.test(a.regra)) return 'Conferir a competência da nota';
  return 'Analisar';
}

Object.assign(App, {
  async issDevolutiva(R, dir) {
    if (!window.ExcelJS) await this.script('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js');
    const e = this.empresa(); const comp = this.comp;
    const meta = ((this.compDoc().iss || {})[dir]) || {};
    const refF = ['portal', 'prefeitura', 'livro'].find(f => R.disp.includes(f));
    const nomeF = { portal: 'NFS-e', prefeitura: 'Prefeitura', livro: 'Livro' };
    const nomeLongo = { portal: 'NFS-e Emissor Nacional', prefeitura: 'Livro/relatório da prefeitura', livro: 'Livro fiscal (sistema)' };
    const outras = ['prefeitura', 'livro'].filter(f => f !== refF && R.disp.includes(f));
    const [ano, mes] = comp.split('-');
    const titulo = (e.fantasia || e.razao) + ' (CNPJ ' + U.fmtCnpj(e.cnpj) + ') - Conferência NFS-e ' + (dir === 'prestados' ? 'Emitidas' : 'Tomadas') + ' - Competência ' + mes + '/' + ano;
    const fontesTxt = 'Fontes: ' + [refF, ...outras].map(f => nomeLongo[f] + (meta[f] && meta[f].nome ? ' (' + meta[f].nome + ')' : '')).join(' x ');
    const linhas = R.linhas.slice().sort((a, b) => (parseInt(a.num, 10) || 0) - (parseInt(b.num, 10) || 0));
    const dataJs = d => d && d.length === 8 ? new Date(Date.UTC(+d.slice(4), +d.slice(2, 4) - 1, +d.slice(0, 2))) : null;
    const sitTxt = r => r ? (r.sit === 'cancelada' ? 'CANCELADA' : r.sit === 'substituida' ? 'SUBSTITUÍDA' : 'REGULAR') : null;
    const liq = r => r && r.valor !== null && r.valor !== undefined ? U.r2(r.valor - (r.ded || 0)) : null;

    const wb = new ExcelJS.Workbook(); wb.creator = 'APURAÇÃO FISCAL'; wb.created = new Date();
    const fonte = { name: 'Calibri', size: 10 };
    const cab = (ws, n) => { const r = ws.getRow(1); r.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFFFF' } }; r.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; r.height = 30; for (let c = 1; c <= n; c++) r.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3864' } }; };

    // ---------------------------------------------------------------- Comparativo
    const C = wb.addWorksheet('Comparativo');
    const cols = [];
    const col = (h, w, get, fmt) => cols.push({ h, w, get, fmt });
    const ref = g => g[refF];
    col('NF', 8, g => +g.num || g.num);
    col('Data', 11, g => dataJs((ref(g) || g.livro || g.prefeitura || {}).data), 'dd/mm/yyyy');
    col((dir === 'prestados' ? 'Tomador' : 'Prestador') + ' (' + nomeF[refF] + ')', 38, g => (ref(g) || {}).nome || ((g.livro || g.prefeitura || {}).nome) || null);
    col('CPF/CNPJ', 19, g => { const d = (ref(g) || g.livro || g.prefeitura || {}).doc; return d ? U.fmtCnpj(d) : null; });
    col('Cód. Serv.', 10, g => (ref(g) || {}).codServ || null);
    col('Situação ' + nomeF[refF], 11, g => sitTxt(ref(g)));
    col('Série ' + nomeF[refF], 8, g => ref(g) && ref(g).serie ? (+ref(g).serie || ref(g).serie) : null);

    if (!Store.podeEscrever) return toast(Store.motivo || 'Acesso somente leitura.', 'warn');
    const docs = m.b.docs.map(d => ({ path: d.path, data: JSON.parse(JSON.stringify(d.data)) }));
    let n = 0; const falhas = [];
    const comRef = docs.filter(d => d.data && d.data.ref && /\/arquivos\//.test(d.path));
    for (const d of comRef) {
      n++; busy('Guardando arquivos originais… ' + n + ' de ' + comRef.length); await tick();
      const chave = (d.data.ref.ids || [d.data.ref.key]).join(',');
      const o = (m.b.originais || {})[chave];
      try {
        if (!o) throw new Error('não veio no backup');
        let bytes;
        if (o.b64 !== undefined) bytes = U.unb64(o.b64);
        else { const f = m.zip && m.zip.file(o.arquivo); if (!f) throw new Error('não veio no backup'); bytes = await f.async('uint8array'); }
        d.data.ref = Object.assign(await Store.putFile(bytes, { nome: o.nome || d.data.nome, mime: o.mime, tipo: d.data.tipo }), { migrado: true });
      } catch (e) { falhas.push((d.data.nome || d.path) + ' (' + e.message + ')'); }
    }
    busy('Gravando ' + docs.length + ' registros…'); await tick();
    try {
      if (Store.sb) await Store.sb.setMany(docs);
      else { let k = 0; for (const d of docs) { if (++k % 20 === 0) { busy('Gravando registros… ' + k + ' de ' + docs.length); await tick(); } await Store.set(d.path, d.data); } }
      const eids = [...new Set(docs.map(d => (d.path.match(/^empresas\/([^/]+)/) || [])[1]).filter(Boolean))];
      for (const eid of eids) await Store.log(eid, 'Dados importados de backup', m.arquivo);
      await this.carregarEmpresas();
      this.migr = { ok: true, resumo: m.resumo, falhas };
      if (!this.eid && this.empresas.length) await this.abrirEmpresa(this.empresas[0].id);
      toast('Importação concluída: ' + docs.length + ' registros' + (falhas.length ? ', ' + falhas.length + ' original(is) com falha' : '') + '.', falhas.length ? 'warn' : 'ok');
    } catch (e) { this.migr.erro = 'Falha ao gravar: ' + e.message; }
    busy(null); this.render();
  },
});
function sbMigracaoCard() {
  const m = App.migr;
  const mb = b => (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
  const noClaude = Store.mode === 'nuvem';
  let corpo = `<p class="muted" style="font-size:13px">${noClaude ? 'Gere um arquivo com tudo o que está salvo aqui no Claude (empresas, competências, importações, apontamentos, pendências, trilha e os arquivos originais) para levar para a sua conta no Supabase.' : 'Exporte tudo o que está nesta conta, ou traga um backup gerado no app do Claude. Importar de novo o mesmo backup substitui os registros, sem duplicar.'}</p>
    <div class="row gap8 wrap" style="margin-top:10px"><button class="btn ${noClaude ? 'primary' : ''}" data-act="bk-exportar">${I.down || I.up} Exportar backup (.json)</button>
    ${!noClaude ? `<label class="btn primary" for="migr-file">${I.up} Importar backup</label><input type="file" id="migr-file" accept=".json,.zip" hidden>` : ''}</div>`;
  if (m && m.erro) corpo += `<div class="banner bad" style="margin-top:12px">${I.warn}<div>${U.esc(m.erro)}</div></div>`;
  if (m && m.resumo && !m.ok) corpo += `<dl class="kv" style="margin-top:12px"><dt>Arquivo</dt><dd>${U.esc(m.arquivo)}</dd><dt>Empresas</dt><dd>${m.resumo.empresas.length}: ${U.esc(m.resumo.empresas.join(', '))}</dd><dt>Competências</dt><dd>${m.resumo.comps}</dd><dt>Registros</dt><dd>${m.resumo.docs}</dd><dt>Originais</dt><dd>${m.resumo.originais} arquivo(s), ${mb(m.resumo.bytes)}</dd></dl>
    <div class="row gap8" style="margin-top:12px"><button class="btn primary" data-act="migr-ok">${I.save} Importar para ${Store.mode === 'supabase' ? 'a minha conta' : 'este navegador'}</button><button class="btn ghost" data-act="migr-x">Cancelar</button></div>`;
  if (m && m.ok) corpo += `<div class="banner ${m.falhas.length ? 'warn' : 'ok'}" style="margin-top:12px"><div>Importação concluída: ${m.resumo.empresas.length} empresa(s), ${m.resumo.comps} competência(s) e ${m.resumo.originais - m.falhas.length} original(is).${m.falhas.length ? ' Falharam: ' + U.esc(m.falhas.join('; ')) : ''}</div></div>`;
  return `<section class="card" style="margin-bottom:16px"><h3>Backup dos dados</h3>${corpo}</section>`;
}
document.addEventListener('change', ev => { const t = ev.target; if (t.id === 'migr-file') { const f = t.files[0]; t.value = ''; if (f) App.migrLer(f); } });
document.addEventListener('click', ev => {
  const el = ev.target.closest && ev.target.closest('[data-act="migr-ok"],[data-act="migr-x"],[data-act="bk-exportar"]'); if (!el) return;
  if (el.dataset.act === 'bk-exportar') App.exportarBackup();
  else if (el.dataset.act === 'migr-ok') App.migrImportar(); else { App.migr = null; App.render(); }
});
</script>
